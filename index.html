<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#040814" />
  <title>Night Stadium Penalty Shootout</title>
  <style>
    :root {
      --bg-void: #03060f;
      --bg-deep: #071022;
      --glass-bg: rgba(8, 16, 34, 0.78);
      --glass-strong: rgba(7, 14, 30, 0.9);
      --glass-border: rgba(136, 200, 255, 0.2);
      --glass-highlight: rgba(255, 255, 255, 0.08);
      --text-main: #f3f8ff;
      --text-muted: #8ea6cb;
      --cyan: #38f9d7;
      --sky: #38bdf8;
      --emerald: #22c55e;
      --amber: #fbbf24;
      --rose: #fb7185;
      --gold: #fcd34d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #102348 0%, #050b18 58%, #02040a 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
      gap: 8px;
    }

    /* Broadcast Scoreboard Header */
    .hud {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 12;
    }

    .scoreboard-shell {
      background: linear-gradient(180deg, rgba(14, 26, 52, 0.88) 0%, rgba(7, 14, 30, 0.9) 100%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 8px 12px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 var(--glass-highlight);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-crest {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(56, 249, 215, 0.22), rgba(56, 189, 248, 0.14));
      border: 1px solid rgba(56, 249, 215, 0.48);
      box-shadow: 0 0 14px rgba(56, 249, 215, 0.28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-crest svg {
      width: 15px;
      height: 15px;
      color: var(--cyan);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #f3f9ff;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sky);
      opacity: 0.85;
      margin-top: 1px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .keeper-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(15, 28, 56, 0.8);
      border: 1px solid rgba(148, 197, 255, 0.22);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      transition: border-color 0.25s, color 0.25s, box-shadow 0.25s, background 0.25s;
    }

    .keeper-pill.level-1 {
      color: #7dd3fc;
      border-color: rgba(125, 211, 252, 0.42);
      background: rgba(14, 58, 92, 0.52);
    }

    .keeper-pill.level-2 {
      color: var(--amber);
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(92, 54, 12, 0.48);
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.18);
    }

    .keeper-pill.level-3 {
      color: var(--rose);
      border-color: rgba(251, 113, 133, 0.6);
      background: rgba(102, 18, 42, 0.55);
      box-shadow: 0 0 16px rgba(251, 113, 133, 0.28);
    }

    .keeper-bars {
      display: inline-flex;
      gap: 2px;
      align-items: flex-end;
      height: 11px;
    }

    .keeper-bars span {
      width: 3px;
      border-radius: 2px;
      background: rgba(143, 166, 201, 0.25);
      transition: background 0.25s, box-shadow 0.25s;
    }

    .keeper-bars span:nth-child(1) { height: 4px; }
    .keeper-bars span:nth-child(2) { height: 7px; }
    .keeper-bars span:nth-child(3) { height: 11px; }

    .keeper-pill.level-1 .keeper-bars span:nth-child(-n+1) { background: #7dd3fc; }
    .keeper-pill.level-2 .keeper-bars span:nth-child(-n+2) { background: var(--amber); }
    .keeper-pill.level-3 .keeper-bars span { background: var(--rose); box-shadow: 0 0 6px rgba(251, 113, 133, 0.7); }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(148, 197, 255, 0.22);
      background: rgba(15, 28, 56, 0.78);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      border-color: rgba(56, 249, 215, 0.5);
      background: rgba(20, 38, 74, 0.9);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .scoreboard-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      align-items: center;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .stat-card {
      position: relative;
      background: linear-gradient(180deg, rgba(20, 36, 68, 0.64), rgba(10, 19, 38, 0.75));
      border: 1px solid rgba(136, 200, 255, 0.16);
      border-radius: 11px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.25s, transform 0.2s;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(136, 200, 255, 0.35), transparent);
      opacity: 0.7;
    }

    .stat-card.pop {
      animation: statPop 0.38s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    @keyframes statPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.07); border-color: rgba(56, 249, 215, 0.65); }
      100% { transform: scale(1); }
    }

    .stat-label {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.1;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1.15;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .stat-value.goals {
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(56, 249, 215, 0.4);
    }

    .stat-value.streak-hot {
      color: var(--amber);
      text-shadow: 0 0 14px rgba(251, 191, 36, 0.55);
    }

    .stat-value.best {
      color: var(--gold);
      text-shadow: 0 0 12px rgba(252, 211, 77, 0.35);
    }

    .kicks-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(9, 17, 36, 0.72);
      border: 1px solid rgba(136, 200, 255, 0.15);
      border-radius: 11px;
      padding: 6px 12px;
    }

    .kicks-meta {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      animation: livePulse 1.6s ease-in-out infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .kicks-label {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c8dcf7;
      white-space: nowrap;
    }

    .kick-pips {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kick-pip {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(143, 166, 201, 0.32);
      background: rgba(12, 22, 44, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: 900;
      color: transparent;
      transition: all 0.25s cubic-bezier(0.22, 1.35, 0.36, 1);
    }

    .kick-pip.active {
      border-color: var(--cyan);
      background: rgba(56, 249, 215, 0.12);
      box-shadow: 0 0 12px rgba(56, 249, 215, 0.55);
      animation: pipPulse 1.25s ease-in-out infinite;
    }

    @keyframes pipPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 6px rgba(56, 249, 215, 0.45); }
      50% { transform: scale(1.14); box-shadow: 0 0 16px rgba(56, 249, 215, 0.88); }
    }

    .kick-pip.goal {
      border-color: var(--emerald);
      background: radial-gradient(circle, rgba(34, 197, 94, 0.42), rgba(16, 185, 129, 0.2));
      color: #bbf7d0;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.55);
    }

    .kick-pip.saved {
      border-color: var(--amber);
      background: radial-gradient(circle, rgba(251, 191, 36, 0.38), rgba(217, 119, 6, 0.2));
      color: #fef08a;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.45);
    }

    .kick-pip.miss {
      border-color: var(--rose);
      background: radial-gradient(circle, rgba(251, 113, 133, 0.38), rgba(190, 18, 60, 0.2));
      color: #fecdd3;
      box-shadow: 0 0 10px rgba(251, 113, 133, 0.45);
    }

    /* Stadium Canvas Stage */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(136, 200, 255, 0.24);
      box-shadow:
        0 20px 55px rgba(0, 0, 0, 0.68),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      background: #030712;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .tap-hint {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(4, 10, 24, 0.72);
      border: 1px solid rgba(148, 197, 255, 0.28);
      backdrop-filter: blur(8px);
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(232, 244, 255, 0.9);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .tap-hint.hidden {
      opacity: 0;
      transform: translate(-50%, 6px);
    }

    /* Broadcast Result Banner */
    .result-banner {
      position: absolute;
      top: 13%;
      left: 50%;
      transform: translate(-50%, -26px) scale(0.72);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      text-align: center;
      padding: 13px 30px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      transition: transform 0.3s cubic-bezier(0.18, 1.38, 0.32, 1), opacity 0.22s ease;
      min-width: 230px;
      overflow: hidden;
    }

    .result-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.22) 50%, transparent 80%);
      transform: translateX(-120%);
      transition: transform 0.65s ease;
    }

    .result-banner.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .result-banner.show::before {
      transform: translateX(120%);
    }

    .result-banner.goal {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.38), rgba(4, 64, 48, 0.9));
      border: 2px solid rgba(56, 249, 215, 0.92);
      box-shadow: 0 0 38px rgba(34, 197, 94, 0.58), 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .result-banner.saved {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.38), rgba(108, 46, 10, 0.9));
      border: 2px solid rgba(251, 191, 36, 0.92);
      box-shadow: 0 0 34px rgba(245, 158, 11, 0.5), 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .result-banner.miss {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.38), rgba(118, 14, 46, 0.9));
      border: 2px solid rgba(251, 113, 133, 0.92);
      box-shadow: 0 0 34px rgba(244, 63, 94, 0.5), 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .banner-title {
      font-size: 2.05rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      line-height: 1.02;
      text-transform: uppercase;
      font-style: italic;
    }

    .result-banner.goal .banner-title {
      color: #d1fae5;
      text-shadow: 0 0 22px rgba(56, 249, 215, 0.9), 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .result-banner.saved .banner-title {
      color: #fef08a;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.85), 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .result-banner.miss .banner-title {
      color: #ffe4e6;
      text-shadow: 0 0 20px rgba(251, 113, 133, 0.85), 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .banner-sub {
      margin-top: 4px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }

    /* End of Round Modal */
    .round-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(3, 7, 18, 0.64);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .round-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .round-card {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(180deg, rgba(14, 26, 54, 0.96), rgba(6, 12, 26, 0.98));
      border: 1px solid rgba(136, 200, 255, 0.34);
      border-radius: 22px;
      padding: 22px 20px 20px;
      text-align: center;
      box-shadow: 0 26px 68px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform: translateY(18px) scale(0.94);
      transition: transform 0.34s cubic-bezier(0.2, 1.28, 0.35, 1);
    }

    .round-overlay.show .round-card {
      transform: translateY(0) scale(1);
    }

    .round-card.perfect {
      border: 2px solid rgba(252, 211, 77, 0.9);
      box-shadow:
        0 0 48px rgba(252, 211, 77, 0.36),
        0 26px 68px rgba(0, 0, 0, 0.78);
      background: linear-gradient(180deg, rgba(44, 34, 10, 0.94), rgba(9, 16, 34, 0.98));
    }

    .trophy-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 249, 215, 0.12);
      border: 1px solid rgba(56, 249, 215, 0.4);
    }

    .round-card.perfect .trophy-wrap {
      background: radial-gradient(circle, rgba(252, 211, 77, 0.38), rgba(245, 158, 11, 0.12));
      border: 2px solid rgba(252, 211, 77, 0.85);
      box-shadow: 0 0 28px rgba(252, 211, 77, 0.5);
      animation: trophyBounce 1.1s ease-in-out infinite;
    }

    @keyframes trophyBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.06); }
    }

    .trophy-wrap svg {
      width: 34px;
      height: 34px;
    }

    .round-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 4px;
    }

    .round-card.perfect .round-badge {
      color: var(--gold);
      text-shadow: 0 0 14px rgba(252, 211, 77, 0.65);
    }

    .round-heading {
      margin: 0;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      color: #ffffff;
    }

    .round-card.perfect .round-heading {
      background: linear-gradient(90deg, #fef08a, #fbbf24, #38f9d7, #fef08a);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 2.2s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .round-subtitle {
      margin: 6px 0 14px;
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.38;
    }

    .round-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .summary-cell {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 8px 6px;
    }

    .summary-cell .s-lbl {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .summary-cell .s-val {
      font-size: 1.15rem;
      font-weight: 900;
      margin-top: 2px;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .summary-pips {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-bottom: 18px;
    }

    .play-again-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #03151d;
      background: linear-gradient(135deg, #38f9d7 0%, #22c55e 100%);
      box-shadow: 0 8px 26px rgba(56, 249, 215, 0.38);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s, filter 0.2s;
    }

    .play-again-btn:hover {
      filter: brightness(1.06);
      box-shadow: 0 10px 30px rgba(56, 249, 215, 0.5);
    }

    .round-card.perfect .play-again-btn {
      background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%);
      color: #1f1300;
      box-shadow: 0 8px 28px rgba(251, 191, 36, 0.45);
    }

    .play-again-btn:active {
      transform: scale(0.97);
    }

    /* Bottom Action Bar */
    .controls {
      flex-shrink: 0;
      z-index: 12;
      display: flex;
      justify-content: center;
    }

    .shoot-btn {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 58px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #22c55e 0%, #10b981 48%, #06b6d4 100%);
      color: #031418;
      font-size: 1.18rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(16, 185, 129, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, filter 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .shoot-btn:hover:not(:disabled) {
      filter: brightness(1.07);
      box-shadow:
        0 12px 32px rgba(16, 185, 129, 0.54),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .shoot-btn:active:not(:disabled) {
      transform: scale(0.975) translateY(1px);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .shoot-btn:disabled {
      opacity: 0.42;
      filter: saturate(0.35);
      cursor: default;
      box-shadow: none;
    }

    .shoot-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Wide Desktop / Tablet Broadcast Layout */
    @media (min-width: 760px) {
      .app {
        padding: 12px 18px 14px;
        gap: 10px;
      }

      .scoreboard-shell {
        padding: 10px 16px;

  <script>
    (() => {
      "use strict";

      const TOTAL_KICKS = 5;
      const STORAGE_KEY_V2 = "night_penalty_shootout_v2_state";
      const STORAGE_KEY_LEGACY = "night_penalty_shootout_best_v1";

      // DOM References
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const stageEl = document.getElementById("stage");
      const shootBtn = document.getElementById("shootBtn");
      const playAgainBtn = document.getElementById("playAgainBtn");
      const soundBtn = document.getElementById("soundBtn");
      const soundIconOn = document.getElementById("soundIconOn");
      const soundIconOff = document.getElementById("soundIconOff");
      const tapHint = document.getElementById("tapHint");

      const goalsVal = document.getElementById("goalsVal");
      const streakVal = document.getElementById("streakVal");
      const bestVal = document.getElementById("bestVal");
      const goalsCard = document.getElementById("goalsCard");
      const streakCard = document.getElementById("streakCard");
      const bestCard = document.getElementById("bestCard");
      const kickCounterLabel = document.getElementById("kickCounterLabel");
      const kickPipsEl = document.getElementById("kickPips");

      const keeperPill = document.getElementById("keeperPill");
      const keeperLabel = document.getElementById("keeperLabel");

      const resultBanner = document.getElementById("resultBanner");
      const bannerTitle = document.getElementById("bannerTitle");
      const bannerSub = document.getElementById("bannerSub");

      const roundOverlay = document.getElementById("roundOverlay");
      const roundCard = document.getElementById("roundCard");
      const trophyWrap = document.getElementById("trophyWrap");
      const roundBadge = document.getElementById("roundBadge");
      const roundHeading = document.getElementById("roundHeading");
      const roundSubtitle = document.getElementById("roundSubtitle");
      const sumGoals = document.getElementById("sumGoals");
      const sumStreak = document.getElementById("sumStreak");
      const sumBest = document.getElementById("sumBest");
      const summaryPips = document.getElementById("summaryPips");

      // Persistent Storage (Best Score & Streak)
      function loadSavedStats() {
        let bestScore = 0;
        let streak = 0;
        let bestStreak = 0;
        try {
          const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (rawV2) {
            const parsed = JSON.parse(rawV2);
            if (parsed && typeof parsed === "object") {
              if (Number.isFinite(parsed.bestScore)) {
                bestScore = Math.max(0, Math.min(TOTAL_KICKS, Math.floor(parsed.bestScore)));
              }
              if (Number.isFinite(parsed.streak)) {
                streak = Math.max(0, Math.floor(parsed.streak));
              }
              if (Number.isFinite(parsed.bestStreak)) {
                bestStreak = Math.max(streak, Math.floor(parsed.bestStreak));
              }
            }
          } else {
            const legacy = parseInt(localStorage.getItem(STORAGE_KEY_LEGACY), 10);
            if (!Number.isNaN(legacy) && legacy >= 0 && legacy <= TOTAL_KICKS) {
              bestScore = legacy;
            }
          }
        } catch (_) {}
        return { bestScore, streak, bestStreak };
      }

      function saveStats(bestScore, streak, bestStreak) {
        try {
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify({
            bestScore,
            streak,
            bestStreak
          }));
          localStorage.setItem(STORAGE_KEY_LEGACY, String(bestScore));
        } catch (_) {}
      }

      // Procedural WebAudio Stadium Synthesizer
      const Sound = (() => {
        let audioCtx = null;
        let muted = false;

        function ensureContext() {
          if (muted) return null;
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            audioCtx = new Ctx();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
          }
          return audioCtx;
        }

        function createNoiseBuffer(ac, duration) {
          const length = Math.floor(ac.sampleRate * duration);
          const buffer = ac.createBuffer(1, length, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          return buffer;
        }

        return {
          toggle() {
            muted = !muted;
            soundIconOn.style.display = muted ? "none" : "block";
            soundIconOff.style.display = muted ? "block" : "none";
            if (!muted) ensureContext();
          },
          kick() {
            const ac = ensureContext();
            if (!ac) return;
            const now = ac.currentTime;

            // Deep boot-on-leather punch
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(175, now);
            osc.frequency.exponentialRampToValueAtTime(44, now + 0.13);
            gain.gain.setValueAtTime(0.46, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain).connect(ac.destination);
            osc.start(now);
            osc.stop(now + 0.16);

            // Leather strike snap + turf brush
            const noise = ac.createBufferSource();
            noise.buffer = createNoiseBuffer(ac, 0.08);
            const bp = ac.createBiquadFilter();
            bp.type = "bandpass";
            bp.frequency.setValueAtTime(1150, now);
            bp.Q.value = 1.1;
            const nGain = ac.createGain();
            nGain.gain.setValueAtTime(0.24, now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            noise.connect(bp).connect(nGain).connect(ac.destination);
            noise.start(now);

            // Ball air whoosh
            const whoosh = ac.createBufferSource();
            whoosh.buffer = createNoiseBuffer(ac, 0.28);
            const wf = ac.createBiquadFilter();
            wf.type = "bandpass";
            wf.frequency.setValueAtTime(500, now + 0.04);
            wf.frequency.exponentialRampToValueAtTime(1400, now + 0.26);
            wf.Q.value = 2.2;
            const wg = ac.createGain();
            wg.gain.setValueAtTime(0.001, now + 0.03);
            wg.gain.linearRampToValueAtTime(0.075, now + 0.11);
            wg.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            whoosh.connect(wf).connect(wg).connect(ac.destination);
            whoosh.start(now + 0.03);
          },
          goal() {
            const ac = ensureContext();
            if (!ac) return;
            const now = ac.currentTime;

            // Nylon net swish
            const netNoise = ac.createBufferSource();
            netNoise.buffer = createNoiseBuffer(ac, 0.25);
            const netFilter = ac.createBiquadFilter();
            netFilter.type = "highpass";
            netFilter.frequency.value = 1700;
            const netGain = ac.createGain();
            netGain.gain.setValueAtTime(0.18, now);
            netGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            netNoise.connect(netFilter).connect(netGain).connect(ac.destination);
            netNoise.start(now);

            // Swelling stadium crowd roar
            const roar = ac.createBufferSource();
            roar.buffer = createNoiseBuffer(ac, 1.35);
            const roarFilter = ac.createBiquadFilter();
            roarFilter.type = "bandpass";
            roarFilter.frequency.setValueAtTime(520, now);
            roarFilter.frequency.linearRampToValueAtTime(1080, now + 0.42);
            roarFilter.frequency.linearRampToValueAtTime(760, now + 1.3);
            roarFilter.Q.value = 0.72;
            const roarGain = ac.createGain();
            roarGain.gain.setValueAtTime(0.005, now);
            roarGain.gain.linearRampToValueAtTime(0.24, now + 0.18);
            roarGain.gain.exponentialRampToValueAtTime(0.001, now + 1.32);
            roar.connect(roarFilter).connect(roarGain).connect(ac.destination);
            roar.start(now);

            // Broadcast triumph triad chime
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = "triangle";
              const start = now + idx * 0.05;
              osc.frequency.setValueAtTime(freq, start);
              gain.gain.setValueAtTime(0.001, start);
              gain.gain.linearRampToValueAtTime(0.14, start + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, start + 0.46);
              osc.connect(gain).connect(ac.destination);
              osc.start(start);
              osc.stop(start + 0.48);
            });
          },
          save() {
            const ac = ensureContext();
            if (!ac) return;
            const now = ac.currentTime;

            // Latex glove slap impact
            const slap = ac.createBufferSource();
            slap.buffer = createNoiseBuffer(ac, 0.12);
            const lp = ac.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 1650;
            const sGain = ac.createGain();
            sGain.gain.setValueAtTime(0.36, now);
            sGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            slap.connect(lp).connect(sGain).connect(ac.destination);
            slap.start(now);

            // Crowd gasp + blocked brass sting
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(295, now);
            osc.frequency.exponentialRampToValueAtTime(124, now + 0.26);
            const f = ac.createBiquadFilter();
            f.type = "lowpass";
            f.frequency.value = 680;
            gain.gain.setValueAtTime(0.13, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(f).connect(gain).connect(ac.destination);
            osc.start(now);
            osc.stop(now + 0.3);
          },
          postHit() {
            const ac = ensureContext();
            if (!ac) return;
            const now = ac.currentTime;
            // Authentic metallic tubular goalpost clang
            [392, 718, 1142, 1690].forEach((freq, i) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = i === 0 ? "triangle" : "sine";
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.24 / (i + 1), now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48 - i * 0.06);
              osc.connect(gain).connect(ac.destination);
              osc.start(now);
              osc.stop(now + 0.5);
            });
          },
          miss() {
            const ac = ensureContext();
            if (!ac) return;
            const now = ac.currentTime;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(235, now);
            osc.frequency.exponentialRampToValueAtTime(102, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.connect(gain).connect(ac.destination);
            osc.start(now);
            osc.stop(now + 0.34);

            // Low disappointed crowd groan
            const groan = ac.createBufferSource();
            groan.buffer = createNoiseBuffer(ac, 0.55);
            const gf = ac.createBiquadFilter();
            gf.type = "bandpass";
            gf.frequency.setValueAtTime(420, now);
            gf.frequency.linearRampToValueAtTime(250, now + 0.5);
            gf.Q.value = 1.6;
            const gg = ac.createGain();
            gg.gain.setValueAtTime(0.005, now);
            gg.gain.linearRampToValueAtTime(0.12, now + 0.1);
            gg.gain.exponentialRampToValueAtTime(0.001, now + 0.52);
            groan.connect(gf).connect(gg).connect(ac.destination);
            groan.start(now);
          },
          fireworkPop() {
            const ac = ensureContext();
            if (!ac) return;
            const now = ac.currentTime;
            const noise = ac.createBufferSource();
            noise.buffer = createNoiseBuffer(ac, 0.22);
            const bp = ac.createBiquadFilter();
            bp.type = "bandpass";
            bp.frequency.setValueAtTime(900 + Math.random() * 500, now);
            bp.Q.value = 0.9;
            const g = ac.createGain();
            g.gain.setValueAtTime(0.11, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
            noise.connect(bp).connect(g).connect(ac.destination);
            noise.start(now);
          },
          perfectFanfare() {
            const ac = ensureContext();
            if (!ac) return;
            const now = ac.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
            notes.forEach((freq, idx) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = "triangle";
              const t = now + idx * 0.095;
              osc.frequency.setValueAtTime(freq, t);
              gain.gain.setValueAtTime(0.001, t);
              gain.gain.linearRampToValueAtTime(0.18, t + 0.025);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.72);
              osc.connect(gain).connect(ac.destination);
              osc.start(t);
              osc.stop(t + 0.75);
            });
          }
        };
      })();

      // =========================================================================
      // 3D Truncated Icosahedron Soccer Ball Geometry (12 Pentagons + Seams)
      // =========================================================================
      const BALL_MESH = (() => {
        const phi = (1 + Math.sqrt(5)) / 2;
        const raw = [
          [0, 1, phi], [0, -1, phi], [0, 1, -phi], [0, -1, -phi],
          [1, phi, 0], [-1, phi, 0], [1, -phi, 0], [-1, -phi, 0],
          [phi, 0, 1], [-phi, 0, 1], [phi, 0, -1], [-phi, 0, -1]
        ];
        const centers = raw.map(([x, y, z]) => {
          const l = Math.hypot(x, y, z);
          return { x: x / l, y: y / l, z: z / l };
        });

        const pentagons = [];
        const seams = [];
        const seenEdges = new Set();

        for (let i = 0; i < centers.length; i++) {
          const c = centers[i];
          // Find 5 nearest neighbors on the icosahedron
          const neighbors = [];
          for (let j = 0; j < centers.length; j++) {
            if (i === j) continue;
            const n = centers[j];
            const dot = c.x * n.x + c.y * n.y + c.z * n.z;
            if (dot > 0.4) neighbors.push({ idx: j, vec: n });
          }

          // Build tangent basis around c
          const ref = Math.abs(c.y) < 0.9 ? { x: 0, y: 1, z: 0 } : { x: 1, y: 0, z: 0 };
          let tx = ref.y * c.z - ref.z * c.y;
          let ty = ref.z * c.x - ref.x * c.z;
          let tz = ref.x * c.y - ref.y * c.x;
          const tl = Math.hypot(tx, ty, tz);
          tx /= tl; ty /= tl; tz /= tl;
          const bx = c.y * tz - c.z * ty;
          const by = c.z * tx - c.x * tz;
          const bz = c.x * ty - c.y * tx;

          neighbors.sort((a, b) => {
            const angA = Math.atan2(
              a.vec.x * bx + a.vec.y * by + a.vec.z * bz,
              a.vec.x * tx + a.vec.y * ty + a.vec.z * tz
            );
            const angB = Math.atan2(
              b.vec.x * bx + b.vec.y * by + b.vec.z * bz,
              b.vec.x * tx + b.vec.y * ty + b.vec.z * tz
            );
            return angA - angB;
          });

          const verts = [];
          for (const nb of neighbors) {
            // Cut icosahedron edge at 1/3 for exact truncated icosahedron pentagon vertex
            const vx = c.x * 0.67 + nb.vec.x * 0.33;
            const vy = c.y * 0.67 + nb.vec.y * 0.33;
            const vz = c.z * 0.67 + nb.vec.z * 0.33;
            const vl = Math.hypot(vx, vy, vz);
            const pA = { x: vx / vl, y: vy / vl, z: vz / vl };
            verts.push(pA);

            const key = i < nb.idx ? `${i}-${nb.idx}` : `${nb.idx}-${i}`;
            if (!seenEdges.has(key)) {
              seenEdges.add(key);
              const wx = nb.vec.x * 0.67 + c.x * 0.33;
              const wy = nb.vec.y * 0.67 + c.y * 0.33;
              const wz = nb.vec.z * 0.67 + c.z * 0.33;
              const wl = Math.hypot(wx, wy, wz);
              seams.push([pA, { x: wx / wl, y: wy / wl, z: wz / wl }]);
            }
          }
          pentagons.push({ center: c, verts });
        }

        return { pentagons, seams };
      })();

      function identityMat3() {
        return [1, 0, 0, 0, 1, 0, 0, 0, 1];
      }

      function rotateMat3(m, wx, wy, wz, dt) {
        const angle = Math.hypot(wx, wy, wz) * dt;
        if (angle < 1e-6) return m;
        const ax = (wx * dt) / angle;
        const ay = (wy * dt) / angle;
        const az = (wz * dt) / angle;
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        const t = 1 - c;

        const r00 = t * ax * ax + c;
        const r01 = t * ax * ay - s * az;
        const r02 = t * ax * az + s * ay;
        const r10 = t * ax * ay + s * az;
        const r11 = t * ay * ay + c;
        const r12 = t * ay * az - s * ax;
        const r20 = t * ax * az - s * ay;
        const r21 = t * ay * az + s * ax;
        const r22 = t * az * az + c;

        return [
          r00 * m[0] + r01 * m[3] + r02 * m[6],
          r00 * m[1] + r01 * m[4] + r02 * m[7],
          r00 * m[2] + r01 * m[5] + r02 * m[8],
          r10 * m[0] + r11 * m[3] + r12 * m[6],
          r10 * m[1] + r11 * m[4] + r12 * m[7],
          r10 * m[2] + r11 * m[5] + r12 * m[8],
          r20 * m[0] + r21 * m[3] + r22 * m[6],
          r20 * m[1] + r21 * m[4] + r22 * m[7],
          r20 * m[2] + r21 * m[5] + r22 * m[8]
        ];
      }

      function transformVec3(m, v) {
        return {
          x: m[0] * v.x + m[1] * v.y + m[2] * v.z,
          y: m[3] * v.x + m[4] * v.y + m[5] * v.z,
          z: m[6] * v.x + m[7] * v.y + m[8] * v.z
        };
      }

      // Dynamic Spring-Mass Goal Net Grid
      const NET_COLS = 22;
      const NET_ROWS = 10;
      const netNodes = [];

      function initNet() {
        netNodes.length = 0;
        for (let r = 0; r <= NET_ROWS; r++) {
          for (let c = 0; c <= NET_COLS; c++) {
            netNodes.push({
              r,
              c,
              u: c / NET_COLS,
              v: r / NET_ROWS,
              dx: 0,
              dy: 0,
              vx: 0,
              vy: 0
            });
          }
        }
      }
      initNet();

      function triggerNetRipple(nx, ny, strength) {
        const clampedX = Math.max(0, Math.min(1, nx));
        const clampedY = Math.max(0, Math.min(1, ny));
        for (const node of netNodes) {
          const edgePin = (node.r === 0 || node.c === 0 || node.c === NET_COLS) ? 0.14 : 1;
          const dist = Math.hypot(node.u - clampedX, node.v - clampedY);
          const falloff = Math.exp(-dist * dist * 14);
          node.vx += (node.u - clampedX) * strength * falloff * 1.55 * edgePin;
          node.vy += (Math.sin(dist * 5.2) * 0.38 - 0.62) * strength * falloff * edgePin;
        }
      }

      // =========================================================================
      // Offscreen Stadium & Pitch Baking (High Detail, Zero Per-Frame Overhead)
      // =========================================================================
      function roundedRectPath(c, x, y, w, h, rTop, rBot = rTop) {
        const rt = Math.min(rTop, w * 0.5, h * 0.5);
        const rb = Math.min(rBot, w * 0.5, h * 0.5);
        c.beginPath();
        c.moveTo(x + rt, y);
        c.lineTo(x + w - rt, y);
        if (rt > 0) c.quadraticCurveTo(x + w, y, x + w, y + rt);
        c.lineTo(x + w, y + h - rb);
        if (rb > 0) c.quadraticCurveTo(x + w, y + h, x + w - rb, y + h);
        c.lineTo(x + rb, y + h);
        if (rb > 0) c.quadraticCurveTo(x, y + h, x, y + h - rb);
        c.lineTo(x, y + rt);
        if (rt > 0) c.quadraticCurveTo(x, y, x + rt, y);
        c.closePath();
      }

      function stadiumArchY(x, w, edgeY, crownY) {
        const u = (x / w) * 2 - 1; // -1..1
        return crownY + (edgeY - crownY) * u * u;
      }

      function generateStadiumEntities() {
        const w = layout.w;
        const hy = layout.horizonY;

        stars = [];
        const starCount = Math.min(72, Math.floor(w * 0.095));
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * hy * 0.42,
            r: 0.55 + Math.random() * 1.25,
            twinkle: Math.random() * Math.PI * 2,
            speed: 1.0 + Math.random() * 2.4
          });
        }

        // Dust motes floating gently in floodlight air
        dustMotes = [];
        for (let i = 0; i < 34; i++) {
          dustMotes.push({
            x: Math.random() * w,
            y: Math.random() * (hy + 65),
            vx: (Math.random() - 0.5) * 9,
            vy: -2 - Math.random() * 5,
            r: 0.9 + Math.random() * 1.6,
            alpha: 0.12 + Math.random() * 0.28,
            phase: Math.random() * Math.PI * 2
          });
        }

        // Multi-tiered animated crowd
        crowd = [];
        flags = [];
        const jerseyPalette = [
          "#1d4ed8", "#2563eb", "#0f766e", "#0284c7", "#334155",
          "#dc2626", "#e11d48", "#f8fafc", "#f59e0b", "#1e3a8a", "#475569"
        ];
        const skinPalette = ["#f1c27d", "#e0ac69", "#c68642", "#8d5524", "#ffdbac"];
        const scarfPalette = ["#38f9d7", "#fbbf24", "#f43f5e", "#60a5fa", "#ffffff"];

        const tierConfigs = [
          // Upper deck (further back, smaller spectators)
          { rows: 4, topEdge: hy * 0.40, topCrown: hy * 0.27, botEdge: hy * 0.59, botCrown: hy * 0.49, size: 2.3, spacing: 8.5, tier: 1 },
          // Lower deck (closer, richer silhouettes)
          { rows: 6, topEdge: hy * 0.65, topCrown: hy * 0.56, botEdge: hy - 18, botCrown: hy - 18, size: 3.1, spacing: 10.5, tier: 0 }
        ];

        for (const tc of tierConfigs) {
          for (let r = 0; r < tc.rows; r++) {
            const frac = (r + 0.5) / tc.rows;
            const count = Math.max(24, Math.floor(w / tc.spacing));
            for (let i = 0; i < count; i++) {
              const xNorm = (i + 0.5) / count;
              // Leave crisp stadium aisle staircases
              const aisleDist = Math.min(
                Math.abs(xNorm - 0.18),
                Math.abs(xNorm - 0.39),
                Math.abs(xNorm - 0.61),
                Math.abs(xNorm - 0.82)
              );
              if (aisleDist < 0.014) continue;

              const x = xNorm * w + (Math.random() - 0.5) * 3.2;
              const yTop = stadiumArchY(x, w, tc.topEdge, tc.topCrown);
              const yBot = stadiumArchY(x, w, tc.botEdge, tc.botCrown);
              const y = yTop + frac * (yBot - yTop) + (Math.random() - 0.5) * 2.2;

              // Skip tunnel cutouts in lower tier
              if (tc.tier === 0 && r >= 3 && (Math.abs(xNorm - 0.28) < 0.025 || Math.abs(xNorm - 0.72) < 0.025)) {
                continue;
              }

              const hasScarf = Math.random() < 0.14;
              const scale = tc.size + frac * 0.75;
              crowd.push({
                x,
                y,
                py: y,
                scale,
                tier: tc.tier,
                jersey: jerseyPalette[Math.floor(Math.random() * jerseyPalette.length)],
                skin: skinPalette[Math.floor(Math.random() * skinPalette.length)],
                scarf: hasScarf ? scarfPalette[Math.floor(Math.random() * scarfPalette.length)] : null,
                phase: Math.random() * Math.PI * 2,
                speed: 2.2 + Math.random() * 1.8
              });

              if (tc.tier === 0 && r >= 1 && r <= 4 && Math.random() < 0.022) {
                flags.push({
                  x,
                  y: y - scale * 1.6,
                  color: scarfPalette[Math.floor(Math.random() * scarfPalette.length)],
                  accent: jerseyPalette[Math.floor(Math.random() * jerseyPalette.length)],
                  phase: Math.random() * Math.PI * 2,
                  size: 9 + Math.random() * 6
                });
              }
            }
          }
        }

        // Group spectators by color bucket for batched 60fps Canvas2D rendering
        const jerseyMap = new Map();
        const skinMap = new Map();
        const scarfMap = new Map();
        for (const p of crowd) {
          if (!jerseyMap.has(p.jersey)) jerseyMap.set(p.jersey, []);
          jerseyMap.get(p.jersey).push(p);
          if (!skinMap.has(p.skin)) skinMap.set(p.skin, []);
          skinMap.get(p.skin).push(p);
          if (p.scarf) {
            if (!scarfMap.has(p.scarf)) scarfMap.set(p.scarf, []);
            scarfMap.get(p.scarf).push(p);
          }
        }
        crowdByJersey = Array.from(jerseyMap.entries());
        crowdBySkin = Array.from(skinMap.entries());
        crowdByScarf = Array.from(scarfMap.entries());
      }

      function buildStaticStadiumCache() {
        const w = layout.w;
        const h = layout.h;
        const dpr = layout.dpr;
        const hy = layout.horizonY;
        const g = layout.goal;

        bgCache.width = Math.round(w * dpr);
        bgCache.height = Math.round(h * dpr);
        bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const c = bgCtx;

        // 1. Deep night sky gradient with atmospheric stadium skyglow
        const sky = c.createLinearGradient(0, 0, 0, hy);
        sky.addColorStop(0, "#02050f");
        sky.addColorStop(0.42, "#07122a");
        sky.addColorStop(0.82, "#0f2247");
        sky.addColorStop(1, "#183361");
        c.fillStyle = sky;
        c.fillRect(0, 0, w, hy + 2);

        // Subtle stadium atmospheric haze glow above arena bowl
        const bowlGlow = c.createRadialGradient(w * 0.5, hy * 0.75, w * 0.05, w * 0.5, hy * 0.65, w * 0.68);
        bowlGlow.addColorStop(0, "rgba(74, 168, 255, 0.22)");
        bowlGlow.addColorStop(0.5, "rgba(38, 92, 178, 0.09)");
        bowlGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
        c.fillStyle = bowlGlow;
        c.fillRect(0, 0, w, hy);

        // Soft wispy night clouds
        c.save();
        for (let i = 0; i < 6; i++) {
          const cx = w * (0.12 + i * 0.16);
          const cy = hy * (0.14 + (i % 3) * 0.075);
          const rx = w * (0.11 + (i % 2) * 0.06);
          const ry = 10 + (i % 3) * 5;
          const cg = c.createRadialGradient(cx, cy, 2, cx, cy, rx);
          cg.addColorStop(0, "rgba(110, 165, 235, 0.075)");
          cg.addColorStop(1, "rgba(110, 165, 235, 0)");
          c.fillStyle = cg;
          c.beginPath();
          c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();

        // 2. Four Floodlight Lattice Towers (behind roof line)
        layout.floodlights = [
          { x: w * 0.095, y: hy * 0.14, aimX: w * 0.36, aimY: hy + (h - hy) * 0.34, scale: 1.0 },
          { x: w * 0.29,  y: hy * 0.21, aimX: w * 0.45, aimY: hy + (h - hy) * 0.24, scale: 0.78 },
          { x: w * 0.71,  y: hy * 0.21, aimX: w * 0.55, aimY: hy + (h - hy) * 0.24, scale: 0.78 },
          { x: w * 0.905, y: hy * 0.14, aimX: w * 0.64, aimY: hy + (h - hy) * 0.34, scale: 1.0 }
        ];

        for (const fl of layout.floodlights) {
          const baseY = stadiumArchY(fl.x, w, hy * 0.35, hy * 0.21) + 18;
          c.save();
          // Lattice pylon struts
          c.strokeStyle = "rgba(70, 102, 148, 0.58)";
          c.lineWidth = 1.6 * fl.scale;
          const topHalf = 4 * fl.scale;
          const botHalf = 9 * fl.scale;
          c.beginPath();
          c.moveTo(fl.x - topHalf, fl.y + 8);
          c.lineTo(fl.x - botHalf, baseY);
          c.moveTo(fl.x + topHalf, fl.y + 8);
          c.lineTo(fl.x + botHalf, baseY);
          c.stroke();

          // Cross-bracing
          c.lineWidth = 1;
          c.strokeStyle = "rgba(88, 126, 178, 0.4)";
          const steps = 4;
          for (let s = 0; s < steps; s++) {
            const t0 = s / steps;
            const t1 = (s + 1) / steps;
            const y0 = fl.y + 8 + (baseY - fl.y - 8) * t0;
            const y1 = fl.y + 8 + (baseY - fl.y - 8) * t1;
            const w0 = topHalf + (botHalf - topHalf) * t0;
            const w1 = topHalf + (botHalf - topHalf) * t1;
            c.beginPath();
            c.moveTo(fl.x - w0, y0);
            c.lineTo(fl.x + w1, y1);
            c.moveTo(fl.x + w0, y0);
            c.lineTo(fl.x - w1, y1);
            c.stroke();
          }

          // Light bank frame
          const bw = 34 * fl.scale;
          const bh = 14 * fl.scale;
          c.fillStyle = "#16243d";
          c.strokeStyle = "rgba(148, 197, 255, 0.45)";
          c.lineWidth = 1.2;
          roundedRectPath(c, fl.x - bw * 0.5, fl.y - bh * 0.5, bw, bh, 3);
          c.fill();
          c.stroke();
          c.restore();
        }

        // 3. Sweeping Curved Stadium Roof Canopy & Upper/Lower Grandstands
        const roofEdgeY = hy * 0.36;
        const roofCrownY = hy * 0.22;

        // Main stadium bowl silhouette
        c.beginPath();
        c.moveTo(0, hy);
        c.lineTo(0, roofEdgeY);
        c.quadraticCurveTo(w * 0.5, roofCrownY - (roofEdgeY - roofCrownY), w, roofEdgeY);
        c.lineTo(w, hy);
        c.closePath();
        const standGrad = c.createLinearGradient(0, roofCrownY, 0, hy);
        standGrad.addColorStop(0, "#0b1630");
        standGrad.addColorStop(0.45, "#081124");
        standGrad.addColorStop(1, "#050b18");
        c.fillStyle = standGrad;
        c.fill();

        // Roof canopy underside with architectural steel ribs
        c.save();
        c.beginPath();
        c.moveTo(0, roofEdgeY);
        c.quadraticCurveTo(w * 0.5, roofCrownY - (roofEdgeY - roofCrownY), w, roofEdgeY);
        c.lineTo(w, roofEdgeY + hy * 0.075);
        c.quadraticCurveTo(w * 0.5, roofCrownY - (roofEdgeY - roofCrownY) + hy * 0.065, 0, roofEdgeY + hy * 0.075);
        c.closePath();
        const roofGrad = c.createLinearGradient(0, roofCrownY, 0, roofEdgeY + hy * 0.08);
        roofGrad.addColorStop(0, "#1c335c");
        roofGrad.addColorStop(1, "#0b1730");
        c.fillStyle = roofGrad;
        c.fill();

        // Roof structural beams
        c.strokeStyle = "rgba(147, 197, 253, 0.2)";
        c.lineWidth = 1.2;
        const ribCount = 16;
        for (let i = 1; i < ribCount; i++) {
          const rx = (i / ribCount) * w;
          const ryTop = stadiumArchY(rx, w, roofEdgeY, roofCrownY);
          const ryBot = ryTop + hy * 0.072;
          c.beginPath();
          c.moveTo(rx, ryTop);
          c.lineTo(rx + (rx - w * 0.5) * 0.04, ryBot);
          c.stroke();
        }

        // Illuminated roof rim edge
        c.strokeStyle = "rgba(165, 224, 255, 0.45)";
        c.lineWidth = 2.2;
        c.beginPath();
        c.moveTo(0, roofEdgeY);
        c.quadraticCurveTo(w * 0.5, roofCrownY - (roofEdgeY - roofCrownY), w, roofEdgeY);
        c.stroke();
        c.restore();

        // Subtle stepped seating concrete terraces
        c.strokeStyle = "rgba(120, 170, 235, 0.085)";
        c.lineWidth = 1;
        for (let r = 0; r < 11; r++) {
          const frac = r / 11;
          const eY = hy * 0.41 + frac * (hy * 0.52);
          const cY = hy * 0.28 + frac * (hy * 0.63);
          c.beginPath();
          c.moveTo(0, eY);
          c.quadraticCurveTo(w * 0.5, cY - (eY - cY), w, eY);
          c.stroke();
        }

        // Illuminated Mid-Tier LED Fascia Ribbon separating upper & lower decks
        const fasEdgeY = hy * 0.615;
        const fasCrownY = hy * 0.525;
        c.save();
        c.beginPath();
        c.moveTo(0, fasEdgeY);
        c.quadraticCurveTo(w * 0.5, fasCrownY - (fasEdgeY - fasCrownY), w, fasEdgeY);
        c.lineTo(w, fasEdgeY + 8);
        c.quadraticCurveTo(w * 0.5, fasCrownY - (fasEdgeY - fasCrownY) + 8, 0, fasEdgeY + 8);
        c.closePath();
        const ribbonGrad = c.createLinearGradient(0, 0, w, 0);
        ribbonGrad.addColorStop(0, "#0b2447");
        ribbonGrad.addColorStop(0.25, "#155e75");
        ribbonGrad.addColorStop(0.5, "#1d4ed8");
        ribbonGrad.addColorStop(0.75, "#155e75");
        ribbonGrad.addColorStop(1, "#0b2447");
        c.fillStyle = ribbonGrad;
        c.fill();
        c.strokeStyle = "rgba(125, 211, 252, 0.45)";
        c.lineWidth = 1;
        c.stroke();
        c.restore();

        // Entrance tunnels in lower tier
        [0.28, 0.72].forEach((txNorm) => {
          const tx = txNorm * w;
          const ty = hy - 28;
          c.fillStyle = "#030712";
          c.strokeStyle = "rgba(125, 211, 252, 0.2)";
          c.lineWidth = 1;
          roundedRectPath(c, tx - 11, ty, 22, 16, 4, 0);
          c.fill();
          c.stroke();
        });

        // 4. Lush Detailed Grass Pitch with Mowing Stripes, Texture & Shadows
        const pitchH = h - hy;
        const pitchGrad = c.createLinearGradient(0, hy, 0, h);
        pitchGrad.addColorStop(0, "#0c4223");
        pitchGrad.addColorStop(0.32, "#125c30");
        pitchGrad.addColorStop(0.72, "#0f532b");
        pitchGrad.addColorStop(1, "#09371c");
        c.fillStyle = pitchGrad;
        c.fillRect(0, hy, w, pitchH);

        // Perspective horizontal mowed grass stripes (alternating light/dark velvet)
        const hStripes = 10;
        for (let i = 0; i < hStripes; i++) {
          const t0 = Math.pow(i / hStripes, 1.42);
          const t1 = Math.pow((i + 1) / hStripes, 1.42);
          const y0 = hy + t0 * pitchH;
          const y1 = hy + t1 * pitchH;
          c.fillStyle = i % 2 === 0 ? "rgba(167, 243, 208, 0.062)" : "rgba(2, 22, 12, 0.11)";
          c.fillRect(0, y0, w, y1 - y0);
        }

        // Cross-cut vertical perspective mowing lanes (subtle checkered stadium turf)
        const vpX = w * 0.5;
        const vpY = hy - pitchH * 0.48;
        const laneCount = 12;
        for (let i = -laneCount; i < laneCount; i++) {
          if ((i + laneCount) % 2 !== 0) continue;
          const xBot0 = w * 0.5 + i * (w * 0.11);
          const xBot1 = w * 0.5 + (i + 1) * (w * 0.11);
          const xTop0 = vpX + (xBot0 - vpX) * (hy - vpY) / (h - vpY);
          const xTop1 = vpX + (xBot1 - vpX) * (hy - vpY) / (h - vpY);
          c.fillStyle = "rgba(134, 239, 172, 0.032)";
          c.beginPath();
          c.moveTo(xTop0, hy);
          c.lineTo(xTop1, hy);
          c.lineTo(xBot1, h);
          c.lineTo(xBot0, h);
          c.closePath();
          c.fill();
        }

        // Fine organic grass blade & dew grain texture (baked once!)
        c.save();
        const grainCount = Math.min(3600, Math.floor(w * pitchH * 0.016));
        for (let i = 0; i < grainCount; i++) {
          const gx = Math.random() * w;
          const gyNorm = Math.random();
          const gy = hy + gyNorm * pitchH;
          const light = Math.random() > 0.48;
          c.fillStyle = light
            ? `rgba(187, 247, 208, ${(0.03 + gyNorm * 0.05).toFixed(3)})`
            : `rgba(3, 28, 14, ${(0.06 + gyNorm * 0.08).toFixed(3)})`;
          const bh = 1.2 + gyNorm * 2.6;
          c.fillRect(gx, gy, 1.1, bh);
        }
        c.restore();

        // Subtle worn turf patches at goalkeeper line & penalty spot
        const gkWear = c.createRadialGradient(w * 0.5, hy + 10, 4, w * 0.5, hy + 10, g.w * 0.36);
        gkWear.addColorStop(0, "rgba(120, 96, 54, 0.16)");
        gkWear.addColorStop(1, "rgba(120, 96, 54, 0)");
        c.fillStyle = gkWear;
        c.beginPath();
        c.ellipse(w * 0.5, hy + 10, g.w * 0.36, 13, 0, 0, Math.PI * 2);
        c.fill();

        const spotWear = c.createRadialGradient(layout.spot.x, layout.spot.y + 8, 2, layout.spot.x, layout.spot.y + 8, 26);
        spotWear.addColorStop(0, "rgba(110, 92, 52, 0.22)");
        spotWear.addColorStop(1, "rgba(110, 92, 52, 0)");
        c.fillStyle = spotWear;
        c.beginPath();
        c.ellipse(layout.spot.x, layout.spot.y + 8, 26, 10, 0, 0, Math.PI * 2);
        c.fill();

        // Stadium floodlight illumination pool + cinematic outer vignette on grass
        const lightPool = c.createRadialGradient(
          w * 0.5, hy + pitchH * 0.36, w * 0.06,
          w * 0.5, hy + pitchH * 0.42, Math.max(w, pitchH) * 0.74
        );
        lightPool.addColorStop(0, "rgba(167, 243, 208, 0.15)");
        lightPool.addColorStop(0.55, "rgba(56, 189, 248, 0.02)");
        lightPool.addColorStop(1, "rgba(2, 10, 18, 0.48)");
        c.fillStyle = lightPool;
        c.fillRect(0, hy, w, pitchH);

        // Crisp perspective chalk pitch markings
        c.save();
        c.strokeStyle = "rgba(242, 253, 246, 0.72)";
        c.lineWidth = 2.4;
        c.shadowColor = "rgba(255, 255, 255, 0.22)";
        c.shadowBlur = 3;

        // Goal line
        c.beginPath();
        c.moveTo(0, hy + 1.5);
        c.lineTo(w, hy + 1.5);
        c.stroke();

        // 6-yard box in perspective
        const box6TopL = g.x - g.w * 0.17;
        const box6TopR = g.x + g.w * 1.17;
        const box6BotY = hy + pitchH * 0.24;
        const box6BotL = vpX + (box6TopL - vpX) * (box6BotY - vpY) / (hy - vpY);
        const box6BotR = vpX + (box6TopR - vpX) * (box6BotY - vpY) / (hy - vpY);

        c.beginPath();
        c.moveTo(box6TopL, hy + 1.5);
        c.lineTo(box6BotL, box6BotY);
        c.lineTo(box6BotR, box6BotY);
        c.lineTo(box6TopR, hy + 1.5);
        c.stroke();

        // 18-yard penalty area outer converging lines
        const box18TopL = g.x - g.w * 0.56;
        const box18TopR = g.x + g.w * 1.56;
        const box18BotY = h + 16;
        const box18BotL = vpX + (box18TopL - vpX) * (box18BotY - vpY) / (hy - vpY);
        const box18BotR = vpX + (box18TopR - vpX) * (box18BotY - vpY) / (hy - vpY);

        c.beginPath();
        c.moveTo(box18TopL, hy + 1.5);
        c.lineTo(box18BotL, box18BotY);
        c.moveTo(box18TopR, hy + 1.5);
        c.lineTo(box18BotR, box18BotY);
        c.stroke();

        // Penalty spot chalk disc
        c.fillStyle = "rgba(246, 255, 250, 0.92)";
        c.beginPath();
        c.ellipse(layout.spot.x, layout.spot.y + 8, 10.5, 4.4, 0, 0, Math.PI * 2);
        c.fill();
        c.restore();

        // Cast shadows from the goalposts onto the pitch (angled away from floodlights)
        c.save();
        const postShadowGrad = c.createLinearGradient(0, hy, 0, hy + 34);
        postShadowGrad.addColorStop(0, "rgba(0, 0, 0, 0.42)");
        postShadowGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        c.fillStyle = postShadowGrad;
        // Left post shadow
        c.beginPath();
        c.moveTo(g.x - 4, hy + 1);
        c.lineTo(g.x + 4, hy + 1);
        c.lineTo(g.x + 26, hy + 30);
        c.lineTo(g.x + 12, hy + 30);
        c.closePath();
        c.fill();
        // Right post shadow
        c.beginPath();
        c.moveTo(g.x + g.w - 4, hy + 1);
        c.lineTo(g.x + g.w + 4, hy + 1);
        c.lineTo(g.x + g.w - 12, hy + 30);
        c.lineTo(g.x + g.w - 26, hy + 30);
        c.closePath();
        c.fill();
        // Goal mouth shadow band
        c.fillStyle = "rgba(0, 0, 0, 0.24)";
        c.fillRect(g.x, hy, g.w, 6);
        c.restore();
      }

      // =========================================================================
      // Responsive Resize & Reset Helpers
      // =========================================================================
      function resizeCanvas() {
        const rect = stageEl.getBoundingClientRect();
        layout.w = Math.max(280, rect.width);
        layout.h = Math.max(300, rect.height);
        layout.dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(layout.w * layout.dpr);
        canvas.height = Math.round(layout.h * layout.dpr);
        ctx.setTransform(layout.dpr, 0, 0, layout.dpr, 0, 0);

        // Goal geometry: balanced proportions on both narrow phones & wide desktops
        const aspect = 2.34;
        const maxGoalW = Math.min(layout.w * 0.76, layout.h * 0.86, 520);
        const maxGoalH = layout.h * 0.305;
        let gw = maxGoalW;
        let gh = gw / aspect;
        if (gh > maxGoalH) {
          gh = maxGoalH;
          gw = gh * aspect;
        }
        const gx = (layout.w - gw) * 0.5;
        const gy = Math.max(layout.h * 0.22, 74);

        layout.goal = {
          x: gx,
          y: gy,
          w: gw,
          h: gh,
          backInsetX: gw * 0.088,
          backInsetY: gh * 0.145
        };

        layout.horizonY = gy + gh;
        layout.spot = {
          x: layout.w * 0.5,
          y: layout.horizonY + (layout.h - layout.horizonY) * 0.735
        };

        if (state.phase === "AIMING") {
          resetBallToSpot();
        }

        generateStadiumEntities();
        buildStaticStadiumCache();
      }

      function getSpotBallRadius() {
        return Math.max(18, Math.min(27, Math.min(layout.w, layout.h) * 0.056));
      }

      function getGoalBallRadius() {
        return Math.max(9.5, Math.min(14, layout.goal.h * 0.095));
      }

      function resetBallToSpot() {
        state.ball.x = layout.spot.x;
        state.ball.y = layout.spot.y;
        state.ball.z = 0;
        state.ball.vx = 0;
        state.ball.vy = 0;
        state.ball.radius = getSpotBallRadius();
        state.ball.rotMat = rotateMat3(identityMat3(), 0.35, 0.55, 0.1, 1);
        state.ball.spinVec = { x: 0, y: 0, z: 0 };
        state.ball.trail = [];
        state.ball.visible = true;
      }

      function resetKeeper() {
        state.keeper.x = 0.5;
        state.keeper.diveStartX = 0.5;
        state.keeper.diveTargetX = 0.5;
        state.keeper.diveTargetY = 0.52;
        state.keeper.diveProgress = 0;
        state.keeper.diveDir = 0;
        state.keeper.state = "IDLE";
        state.keeper.resultAnimTime = 0;
        state.keeper.landedDustDone = false;
        state.keeper.pose = null;
      }

      // =========================================================================
      // Articulated Goalkeeper Kinematics
      // =========================================================================
      function computeKeeperPose(diveT) {
        const g = layout.goal;
        const k = state.keeper;
        const clampedT = Math.max(0, Math.min(1, diveT));
        const ease = 1 - Math.pow(1 - clampedT, 2.35);

        const idleShift = k.state === "IDLE"
          ? Math.sin(k.idleTime * 3.1) * 0.025 +
            (state.streak >= 2
              ? (Math.max(0, Math.min(1, state.reticleNx)) - 0.5) * Math.min(0.11, state.streak * 0.018)
              : 0)
          : 0;
        const idleBob = k.state === "IDLE" ? Math.abs(Math.sin(k.idleTime * 6.2)) * 3.8 : 0;

        const baseCenterX = g.x + (k.diveStartX + idleShift) * g.w;
        const groundY = g.y + g.h;
        const unit = g.h * 0.445;
        const baseHipY = groundY - unit * 0.62 + idleBob;
        const reachBonus = 1 + Math.min(0.16, state.streak * 0.024);

        const targetX = g.x + k.diveTargetX * g.w;
        const targetY = g.y + k.diveTargetY * g.h;

        // IDLE athletic goalkeeper crouch
        if (k.state === "IDLE" || (k.state === "DIVING" && clampedT <= 0.001)) {
          const hipX = baseCenterX;
          const hipY = baseHipY;
          const shoulderX = hipX;
          const shoulderY = hipY - unit * 0.58;
          const headX = shoulderX;
          const headY = shoulderY - unit * 0.30;

          const sway = Math.sin(k.idleTime * 3.1) * unit * 0.05;
          const leftHandX = shoulderX - unit * 0.54 + sway;
          const leftHandY = shoulderY + unit * 0.16 + idleBob * 0.4;
          const rightHandX = shoulderX + unit * 0.54 + sway;
          const rightHandY = shoulderY + unit * 0.16 + idleBob * 0.4;

          return {
            hipX, hipY,
            shoulderX, shoulderY,
            headX, headY,
            leftElbowX: shoulderX - unit * 0.36,
            leftElbowY: shoulderY + unit * 0.24,
            rightElbowX: shoulderX + unit * 0.36,
            rightElbowY: shoulderY + unit * 0.24,
            leftHandX, leftHandY,
            rightHandX, rightHandY,
            leftKneeX: hipX - unit * 0.27,
            leftKneeY: hipY + unit * 0.32,
            rightKneeX: hipX + unit * 0.27,
            rightKneeY: hipY + unit * 0.32,
            leftFootX: hipX - unit * 0.31,
            leftFootY: groundY - 1,
            rightFootX: hipX + unit * 0.31,
            rightFootY: groundY - 1,
            gloveMidX: shoulderX,
            gloveMidY: shoulderY,
            dir: 0,
            unit,
            airborne: 0
          };
        }

        const dir = k.diveDir;
        if (dir === 0) {
          // Explosive center jump / reflex block
          const lift = Math.sin(ease * Math.PI * 0.82) * (g.h * 0.17);
          const hipX = baseCenterX + (targetX - baseCenterX) * ease;
          const hipY = baseHipY + (targetY + unit * 0.2 - baseHipY) * ease - lift * 0.34;
          const shoulderX = hipX;
          const shoulderY = hipY - unit * 0.60;
          const armUp = ease * unit * 0.66 * reachBonus;

          const celebratePump = k.state === "CELEBRATE" ? Math.sin(k.resultAnimTime * 12) * unit * 0.08 : 0;
          const dejectedDrop = k.state === "DEJECTED" ? Math.min(1, k.resultAnimTime * 2.4) * unit * 0.35 : 0;

          const lHandX = shoulderX - unit * 0.46;
          const lHandY = shoulderY - armUp + celebratePump + dejectedDrop;
          const rHandX = shoulderX + unit * 0.46;
          const rHandY = shoulderY - armUp - celebratePump + dejectedDrop;

          return {
            hipX, hipY: hipY + dejectedDrop * 0.4,
            shoulderX, shoulderY: shoulderY + dejectedDrop * 0.4,
            headX: shoulderX,
            headY: shoulderY - unit * 0.30 + dejectedDrop * 0.45,
            leftElbowX: (shoulderX + lHandX) * 0.5 - unit * 0.08,
            leftElbowY: (shoulderY + lHandY) * 0.5 + unit * 0.06,
            rightElbowX: (shoulderX + rHandX) * 0.5 + unit * 0.08,
            rightElbowY: (shoulderY + rHandY) * 0.5 + unit * 0.06,
            leftHandX: lHandX,
            leftHandY: lHandY,
            rightHandX: rHandX,
            rightHandY: rHandY,
            leftKneeX: hipX - unit * 0.25,
            leftKneeY: Math.min(groundY - 4, hipY + unit * 0.35),
            rightKneeX: hipX + unit * 0.25,
            rightKneeY: Math.min(groundY - 4, hipY + unit * 0.35),
            leftFootX: hipX - unit * 0.28,
            leftFootY: Math.min(groundY - 1, hipY + unit * 0.68),
            rightFootX: hipX + unit * 0.28,
            rightFootY: Math.min(groundY - 1, hipY + unit * 0.68),
            gloveMidX: shoulderX,
            gloveMidY: shoulderY - armUp,
            dir: 0,
            unit,
            airborne: Math.max(0, (groundY - (hipY + unit * 0.68)) / unit)
          };
        }

        // Full-stretch acrobatic sideways dive
        const dx = targetX - baseCenterX;
        const dy = targetY - baseHipY;
        const diveAngle = Math.atan2(dy, dx);
        const arcLift = Math.sin(ease * Math.PI) * g.h * 0.095;

        // Subtle settle onto turf after peak stretch
        const settleDrop = clampedT > 0.82 ? ((clampedT - 0.82) / 0.18) * unit * 0.16 : 0;

        const gloveMidX = baseCenterX + (targetX - baseCenterX) * ease;
        const gloveMidY = Math.min(
          groundY - 6,
          baseHipY - unit * 0.34 + (targetY - (baseHipY - unit * 0.34)) * ease - arcLift + settleDrop
        );

        const ux = Math.cos(diveAngle);
        const uy = Math.sin(diveAngle);
        const px = -uy;
        const py = ux;
        const upSign = dir > 0 ? -1 : 1; // points toward top of body during dive

        const shoulderX = gloveMidX - ux * (unit * 0.72 * reachBonus);
        const shoulderY = Math.min(groundY - 8, gloveMidY - uy * (unit * 0.72 * reachBonus));
        const hipX = shoulderX - ux * (unit * 0.61);
        const hipY = Math.min(groundY - 6, shoulderY - uy * (unit * 0.61));

        const headX = shoulderX + ux * (unit * 0.24) + px * (upSign * unit * 0.15);
        const headY = shoulderY + uy * (unit * 0.24) + py * (upSign * unit * 0.15);

        const spread = unit * 0.18;
        const leftHandX = gloveMidX + px * spread;
        const leftHandY = gloveMidY + py * spread;
        const rightHandX = gloveMidX - px * spread;
        const rightHandY = gloveMidY - py * spread;

        const leftElbowX = (shoulderX + leftHandX) * 0.5 + px * spread * 0.55;
        const leftElbowY = (shoulderY + leftHandY) * 0.5 + py * spread * 0.55;
        const rightElbowX = (shoulderX + rightHandX) * 0.5 - px * spread * 0.55;
        const rightElbowY = (shoulderY + rightHandY) * 0.5 - py * spread * 0.55;

        // Athletic dive legs: top leg slightly bent at knee, bottom leg trailing straight
        const leftKneeX = hipX - ux * (unit * 0.35) + px * (upSign * unit * 0.19);
        const leftKneeY = Math.min(groundY - 2, hipY - uy * (unit * 0.35) + py * (upSign * unit * 0.19));
        const rightKneeX = hipX - ux * (unit * 0.36) - px * (upSign * unit * 0.08);
        const rightKneeY = Math.min(groundY - 2, hipY - uy * (unit * 0.36) - py * (upSign * unit * 0.08));

        const leftFootX = hipX - ux * (unit * 0.68) + px * (upSign * unit * 0.08);
        const leftFootY = Math.min(groundY + 2, hipY - uy * (unit * 0.68) + py * (upSign * unit * 0.08));
        const rightFootX = hipX - ux * (unit * 0.72) - px * (upSign * unit * 0.14);
        const rightFootY = Math.min(groundY + 2, hipY - uy * (unit * 0.72) - py * (upSign * unit * 0.14));

        return {
          hipX, hipY,
          shoulderX, shoulderY,
          headX, headY,
          leftElbowX, leftElbowY,
          rightElbowX, rightElbowY,
          leftHandX, leftHandY,
          rightHandX, rightHandY,
          leftKneeX, leftKneeY,
          rightKneeX, rightKneeY,
          leftFootX, leftFootY,
          rightFootX, rightFootY,
          gloveMidX, gloveMidY,
          dir,
          unit,
          airborne: Math.max(0, (groundY - hipY) / (g.h * 0.8))
        };
      }

      function pointToSegmentDist(px, py, ax, ay, bx, by) {
        const vx = bx - ax;
        const vy = by - ay;
        const wx = px - ax;
        const wy = py - ay;
        const lenSq = vx * vx + vy * vy;
        if (lenSq < 0.0001) return Math.hypot(px - ax, py - ay);
        const t = Math.max(0, Math.min(1, (wx * vx + wy * vy) / lenSq));
        return Math.hypot(px - (ax + t * vx), py - (ay + t * vy));
      }

      // =========================================================================
      // Goalkeeper AI & Shot Execution (Faithful Original Rules)
      // =========================================================================
      function chooseKeeperDive(shotNx, shotNy) {
        const streak = state.streak;

        let shotZoneId = 2;
        if (shotNx < 0.37) {
          shotZoneId = shotNy < 0.52 ? 1 : 0;
        } else if (shotNx > 0.63) {
          shotZoneId = shotNy < 0.52 ? 3 : 4;
        } else {
          shotZoneId = 2;
        }

        const smartReadChance = Math.min(0.60, streak * 0.105);
        const sideReadChance = streak >= 2 ? Math.min(0.28, (streak - 1) * 0.065) : 0;

        let chosenZone;
        let readExact = false;

        if (Math.random() < smartReadChance) {
          chosenZone = KEEPER_ZONES[shotZoneId];
          readExact = true;
        } else if (Math.random() < sideReadChance && shotZoneId !== 2) {
          const sameSide = shotNx < 0.5 ? [KEEPER_ZONES[0], KEEPER_ZONES[1]] : [KEEPER_ZONES[3], KEEPER_ZONES[4]];
          chosenZone = sameSide[Math.floor(Math.random() * sameSide.length)];
        } else {
          chosenZone = KEEPER_ZONES[Math.floor(Math.random() * KEEPER_ZONES.length)];
        }

        const diveDelay = Math.max(0.025, 0.135 - streak * 0.018);
        const diveDuration = Math.max(0.29, 0.48 - streak * 0.028);

        let targetNx = chosenZone.nx;
        let targetNy = chosenZone.ny;
        if (readExact) {
          const accuracy = Math.min(0.72, 0.25 + streak * 0.085);
          const clampedShotX = Math.max(0.08, Math.min(0.92, shotNx));
          const clampedShotY = Math.max(0.14, Math.min(0.86, shotNy));
          targetNx = chosenZone.nx + (clampedShotX - chosenZone.nx) * accuracy + (Math.random() - 0.5) * 0.05;
          targetNy = chosenZone.ny + (clampedShotY - chosenZone.ny) * accuracy + (Math.random() - 0.5) * 0.05;
        } else {
          targetNx += (Math.random() - 0.5) * 0.06;
          targetNy += (Math.random() - 0.5) * 0.06;
        }

        return {
          zone: chosenZone,
          targetNx: Math.max(0.08, Math.min(0.92, targetNx)),
          targetNy: Math.max(0.16, Math.min(0.86, targetNy)),
          dir: chosenZone.dir,
          diveDelay,
          diveDuration
        };
      }

      function takeShot() {
        if (state.phase !== "AIMING") return;

        Sound.kick();
        state.hasShotOnce = true;
        tapHint.classList.add("hidden");

        const g = layout.goal;
        const nx = state.reticleNx;
        const ny = state.reticleNy;
        const targetX = g.x + nx * g.w;
        const targetY = g.y + ny * g.h;

        const flightDuration = 0.46;

        // Plan keeper dive
        const divePlan = chooseKeeperDive(nx, ny);
        state.keeper.state = "DIVING";
        state.keeper.diveStartX = state.keeper.x;
        state.keeper.diveTargetX = divePlan.targetNx;
        state.keeper.diveTargetY = divePlan.targetNy;
        state.keeper.diveDir = divePlan.dir;
        state.keeper.diveDelay = divePlan.diveDelay;
        state.keeper.diveDuration = divePlan.diveDuration;
        state.keeper.diveProgress = 0;
        state.keeper.resultAnimTime = 0;
        state.keeper.landedDustDone = false;

        // Evaluate exact collision at ball arrival time
        const keeperTAtArrival = Math.max(0, Math.min(1, (flightDuration - divePlan.diveDelay) / divePlan.diveDuration));
        const arrivalPose = computeKeeperPose(keeperTAtArrival);

        let outcome = "goal";
        let detail = "CLINICAL FINISH!";
        let postSide = 0;

        const postMarginInner = 0.032;
        const postMarginOuter = 0.036;
        if (nx < -postMarginOuter || nx > 1 + postMarginOuter) {
          outcome = "miss";
          detail = nx < 0 ? "WIDE LEFT!" : "WIDE RIGHT!";
        } else if (nx < postMarginInner) {
          outcome = "miss";
          detail = "OFF THE LEFT POST!";
          postSide = -1;
        } else if (nx > 1 - postMarginInner) {
          outcome = "miss";
          detail = "OFF THE RIGHT POST!";
          postSide = 1;
        } else {
          const gloveDist = Math.min(
            Math.hypot(targetX - arrivalPose.leftHandX, targetY - arrivalPose.leftHandY),
            Math.hypot(targetX - arrivalPose.rightHandX, targetY - arrivalPose.rightHandY),
            Math.hypot(targetX - arrivalPose.gloveMidX, targetY - arrivalPose.gloveMidY)
          );
          const bodyDist = pointToSegmentDist(
            targetX, targetY,
            arrivalPose.hipX, arrivalPose.hipY,
            arrivalPose.gloveMidX, arrivalPose.gloveMidY
          );

          const saveRadius = g.h * Math.min(0.24, 0.165 + state.streak * 0.012);
          const gloveBonusRadius = saveRadius * 1.15;

          if (gloveDist <= gloveBonusRadius || bodyDist <= saveRadius * 0.92) {
            outcome = "saved";
            detail = gloveDist > saveRadius * 0.72 ? "FINGERTIP SAVE!" : "KEEPER READ IT!";
          } else {
            outcome = "goal";
            if (ny < 0.34 && (nx < 0.26 || nx > 0.74)) {
              detail = "TOP BINS!";
            } else if (ny > 0.66 && (nx < 0.26 || nx > 0.74)) {
              detail = "BOTTOM CORNER!";
            } else if (nx < 0.22 || nx > 0.78) {
              detail = "UNSTOPPABLE!";
            } else {
              detail = "CLINICAL FINISH!";
            }
          }
        }

        // Subtle realistic swerve curve during flight
        const swerve = (nx - 0.5) * g.w * 0.13;

        state.shot = {
          startX: layout.spot.x,
          startY: layout.spot.y,
          targetX,
          targetY,
          nx,
          ny,
          swerve,
          elapsed: 0,
          duration: flightDuration,
          arcHeight: g.h * (0.40 + (1 - ny) * 0.34),
          outcome,
          detail,
          postSide,
          resolved: false
        };

        // 3D ball spin vector (backspin/topspin + curling sidespin)
        state.ball.spinVec = {
          x: -14 - (1 - ny) * 6,
          y: (nx - 0.5) * 24,
          z: (nx - 0.5) * 8
        };
        state.ball.trail = [];
        state.phase = "FLIGHT";
        shootBtn.disabled = true;

        // Spray grass blades & white chalk dust from penalty spot
        spawnTurfBurst(layout.spot.x, layout.spot.y + 8, 14, 1);
      }

      // =========================================================================
      // Particles, Sparks, Turf, Pyro, Confetti & Fireworks
      // =========================================================================
      function spawnTurfBurst(x, y, count, power) {
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI * (0.15 + Math.random() * 0.7);
          const spd = (55 + Math.random() * 110) * power;
          const isChalk = i < count * 0.35;
          state.particles.push({
            x: x + (Math.random() - 0.5) * 14,
            y: y + (Math.random() - 0.5) * 4,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 20,
            size: isChalk ? 2.2 + Math.random() * 2.4 : 2.5 + Math.random() * 3.2,
            color: isChalk ? "#ecfdf5" : (Math.random() > 0.4 ? "#4ade80" : "#15803d"),
            alpha: 0.95,
            life: 0.38 + Math.random() * 0.28,
            maxLife: 0.66,
            gravity: 360,
            shape: isChalk ? "circle" : "blade",
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 14
          });
        }
      }

      function spawnParticles(x, y, count, color, speed, life, shape = "circle") {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = speed * (0.28 + Math.random() * 0.88);
          state.particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - speed * 0.24,
            size: 2.2 + Math.random() * 3.8,
            color,
            alpha: 1,
            life: life * (0.7 + Math.random() * 0.45),
            maxLife: life * 1.15,
            gravity: 270,
            shape,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 12
          });
        }
      }
