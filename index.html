        ctx.ellipse((p.hipX + p.shoulderX) * 0.5, g.y + g.h + 2, u * 0.72, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs (shorts + socks)
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        const kneeLX = (p.hipX + p.leftFootX) * 0.5 - (state.keeper.diveDir === 0 ? 4 : 0);
        const kneeLY = (p.hipY + p.leftFootY) * 0.5;
        const kneeRX = (p.hipX + p.rightFootX) * 0.5 + (state.keeper.diveDir === 0 ? 4 : 0);
        const kneeRY = (p.hipY + p.rightFootY) * 0.5;

        // Socks
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = Math.max(4, u * 0.16);
        ctx.beginPath();
        ctx.moveTo(kneeLX, kneeLY);
        ctx.lineTo(p.leftFootX, p.leftFootY);
        ctx.moveTo(kneeRX, kneeRY);
        ctx.lineTo(p.rightFootX, p.rightFootY);
        ctx.stroke();

        // Shorts
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(5.5, u * 0.22);
        ctx.beginPath();
        ctx.moveTo(p.hipX, p.hipY);
        ctx.lineTo(kneeLX, kneeLY);
        ctx.moveTo(p.hipX, p.hipY);
        ctx.lineTo(kneeRX, kneeRY);
        ctx.stroke();

        // Boots
        ctx.fillStyle = "#38f9d7";
        ctx.beginPath();
        ctx.arc(p.leftFootX, p.leftFootY, Math.max(3.2, u * 0.11), 0, Math.PI * 2);
        ctx.arc(p.rightFootX, p.rightFootY, Math.max(3.2, u * 0.11), 0, Math.PI * 2);
        ctx.fill();

        // Torso jersey (high-visibility neon orange/gold that shifts hotter with streak)
        const jerseyColor = state.streak >= 4 ? "#fb7185" : state.streak >= 2 ? "#f59e0b" : "#fb923c";
        ctx.strokeStyle = jerseyColor;
        ctx.lineWidth = Math.max(10, u * 0.42);
        ctx.beginPath();
        ctx.moveTo(p.hipX, p.hipY);
        ctx.lineTo(p.shoulderX, p.shoulderY);
        ctx.stroke();

        // Jersey stripe accent
        ctx.strokeStyle = "rgba(15, 23, 42, 0.55)";
        ctx.lineWidth = Math.max(3, u * 0.12);
        ctx.beginPath();
        ctx.moveTo(p.hipX + (p.shoulderX - p.hipX) * 0.25, p.hipY + (p.shoulderY - p.hipY) * 0.25);
        ctx.lineTo(p.hipX + (p.shoulderX - p.hipX) * 0.75, p.hipY + (p.shoulderY - p.hipY) * 0.75);
        ctx.stroke();

        // Arms
        ctx.strokeStyle = jerseyColor;
        ctx.lineWidth = Math.max(4.5, u * 0.17);
        ctx.beginPath();
        ctx.moveTo(p.shoulderX, p.shoulderY);
        ctx.lineTo(p.leftHandX, p.leftHandY);
        ctx.moveTo(p.shoulderX, p.shoulderY);
        ctx.lineTo(p.rightHandX, p.rightHandY);
        ctx.stroke();

        // Glowing keeper gloves
        ctx.shadowColor = "#38f9d7";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#f8fafc";
        ctx.strokeStyle = "#0ea5e9";
        ctx.lineWidth = 1.6;
        const gloveR = Math.max(4.5, u * 0.15);
        [
          [p.leftHandX, p.leftHandY],
          [p.rightHandX, p.rightHandY]
        ].forEach(([gx, gy]) => {
          ctx.beginPath();
          ctx.arc(gx, gy, gloveR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
        ctx.shadowBlur = 0;

        // Head
        const headR = Math.max(6, u * 0.22);
        ctx.fillStyle = "#f1c27d";
        ctx.beginPath();
        ctx.arc(p.headX, p.headY, headR, 0, Math.PI * 2);
        ctx.fill();

        // Hair cap
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.arc(p.headX, p.headY - headR * 0.18, headR * 0.96, Math.PI * 1.05, Math.PI * 1.95);
        ctx.fill();

        ctx.restore();
      }

      function drawReticle(nowSec) {
        if (state.phase !== "AIMING") return;

        const g = layout.goal;
        const x = g.x + state.reticleNx * g.w;
        const y = g.y + state.reticleNy * g.h;

        // Color feedback: cyan inside goal, amber on post, red when wide
        let color = "#38f9d7";
        if (state.reticleNx < -0.036 || state.reticleNx > 1.036) {
          color = "#fb7185";
        } else if (state.reticleNx < 0.032 || state.reticleNx > 0.968) {
          color = "#fbbf24";
        }

        // Motion trail dots
        for (let i = 0; i < state.reticleTrail.length; i++) {
          const pt = state.reticleTrail[i];
          const frac = (i + 1) / state.reticleTrail.length;
          ctx.fillStyle = color;
          ctx.globalAlpha = frac * 0.24;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2 + frac * 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        const pulse = 1 + Math.sin(nowSec * 9) * 0.07;
        const r = Math.max(15, g.h * 0.145) * pulse;

        ctx.save();
        ctx.translate(x, y);
        ctx.shadowColor = color;
        ctx.shadowBlur = 16;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.4;

        // Outer ring
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();

        // Crosshair ticks
        const inner = r * 0.45;
        const outer = r * 1.38;
        ctx.beginPath();
        ctx.moveTo(-outer, 0); ctx.lineTo(-inner, 0);
        ctx.moveTo(inner, 0);  ctx.lineTo(outer, 0);
        ctx.moveTo(0, -outer); ctx.lineTo(0, -inner);
        ctx.moveTo(0, inner);  ctx.lineTo(0, outer);
        ctx.stroke();

        // Center dot
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawBall() {
        const b = state.ball;
        if (!b.visible) return;

        // Ground shadow
        let shadowY = b.y + b.radius * 0.85;
        let shadowScale = 1;
        if (state.phase === "FLIGHT" && state.shot) {
          const t = Math.min(1, state.shot.elapsed / state.shot.duration);
          const easeT = 1 - Math.pow(1 - t, 1.55);
          shadowY = state.shot.startY + (layout.horizonY + 4 - state.shot.startY) * easeT + 6;
          shadowScale = Math.max(0.35, 1 - b.z / (layout.goal.h * 1.2));
        } else if (state.phase === "AIMING") {
          shadowY = layout.spot.y + b.radius * 0.82;
        } else {
          shadowY = Math.max(b.y + b.radius * 0.8, layout.horizonY + 2);
          shadowScale = 0.65;
        }

        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
        ctx.beginPath();
        ctx.ellipse(b.x, shadowY, b.radius * 0.95 * shadowScale, b.radius * 0.36 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Glowing flight trail
        if (b.trail.length > 1) {
          for (let i = 0; i < b.trail.length; i++) {
            const pt = b.trail[i];
            const frac = (i + 1) / b.trail.length;
            ctx.fillStyle = `rgba(56, 249, 215, ${(frac * 0.24).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.r * frac * 0.78, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Soccer ball sphere
        ctx.translate(b.x, b.y);
        const grad = ctx.createRadialGradient(-b.radius * 0.32, -b.radius * 0.32, b.radius * 0.1, 0, 0, b.radius);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.7, "#e2e8f0");
        grad.addColorStop(1, "#94a3b8");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        ctx.fill();

        // Clip rotating pentagon patches inside ball
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        ctx.clip();

        ctx.rotate(b.spin);
        ctx.fillStyle = "#1e293b";
        drawPentagon(0, 0, b.radius * 0.38);

        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
          const px = Math.cos(a) * b.radius * 0.88;
          const py = Math.sin(a) * b.radius * 0.88;
          drawPentagon(px, py, b.radius * 0.32);

          ctx.strokeStyle = "rgba(30, 41, 59, 0.48)";
          ctx.lineWidth = Math.max(1, b.radius * 0.06);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * b.radius * 0.34, Math.sin(a) * b.radius * 0.34);
          ctx.lineTo(px, py);
          ctx.stroke();
        }
        ctx.restore();

        // Crisp rim
        ctx.strokeStyle = "rgba(15, 23, 42, 0.45)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      function drawPentagon(cx, cy, r) {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawEffects() {
        // Impact shockwave rings
        for (const ring of state.rings) {
          ctx.save();
          ctx.strokeStyle = ring.color;
          ctx.globalAlpha = Math.max(0, ring.alpha);
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Particles & confetti
        for (const p of state.particles) {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          if (p.shape === "rect") {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot || 0);
            ctx.fillRect(-p.size * 0.6, -p.size * 0.35, p.size * 1.2, p.size * 0.7);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function render(nowMs) {
        const nowSec = nowMs * 0.001;
        ctx.save();

        if (state.screenShake > 0.2) {
          const sx = (Math.random() - 0.5) * state.screenShake * 1.4;
          const sy = (Math.random() - 0.5) * state.screenShake * 1.4;
          ctx.translate(sx, sy);
        }

        drawStadium(nowSec);
        drawGoalNet();

        // Draw ball behind keeper & goal frame when it has entered the net on a goal
        const ballInNet = state.phase === "RESULT" && state.shot && state.shot.outcome === "goal";
        if (ballInNet) {
          drawBall();
        }

        drawGoalFrame();
        drawGoalkeeper();
        drawReticle(nowSec);

        if (!ballInNet) {
          drawBall();
        }

        drawEffects();
        ctx.restore();
      }

      // Animation loop
      let lastTs = 0;
      function loop(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        update(dt);
        render(ts);
        requestAnimationFrame(loop);
      }

      // Controls & Event Listeners
      shootBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        takeShot();
      });
      shootBtn.addEventListener("click", () => {
        takeShot();
      });

      canvas.addEventListener("pointerdown", (e) => {
        if (state.phase !== "AIMING") return;
        e.preventDefault();
        takeShot();
      });

      playAgainBtn.addEventListener("click", () => {
        startNewRound();
      });

      soundBtn.addEventListener("click", () => {
        Sound.toggle();
      });

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "Enter") {
          if (state.phase === "AIMING") {
            e.preventDefault();
            takeShot();
          } else if (state.phase === "ROUND_OVER") {
            e.preventDefault();
            startNewRound();
          }
        }
      });

      window.addEventListener("resize", resizeCanvas);
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(resizeCanvas).observe(stageEl);
      }

      // Initialize
      resizeCanvas();
      startNewRound();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
