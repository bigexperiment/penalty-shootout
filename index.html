      function spawnGoalPyro() {
        const hy = layout.horizonY - 12;
        const g = layout.goal;
        const jets = [g.x - 24, g.x + g.w + 24, layout.w * 0.12, layout.w * 0.88];
        for (const jx of jets) {
          if (jx < 10 || jx > layout.w - 10) continue;
          for (let i = 0; i < 6; i++) {
            state.particles.push({
              x: jx + (Math.random() - 0.5) * 6,
              y: hy,
              vx: (Math.random() - 0.5) * 32,
              vy: -135 - Math.random() * 110,
              size: 2 + Math.random() * 2.6,
              color: Math.random() > 0.35 ? "#fde047" : "#38f9d7",
              alpha: 1,
              life: 0.45 + Math.random() * 0.35,
              maxLife: 0.8,
              gravity: 240,
              shape: "spark"
            });
          }
        }
      }

      function spawnFirework(x, y) {
        const colors = ["#fcd34d", "#38f9d7", "#60a5fa", "#f472b6", "#4ade80", "#ffffff"];
        const primary = colors[Math.floor(Math.random() * colors.length)];
        const secondary = colors[Math.floor(Math.random() * colors.length)];
        Sound.fireworkPop();

        for (let i = 0; i < 42; i++) {
          const ang = (i / 42) * Math.PI * 2 + (Math.random() - 0.5) * 0.14;
          const spd = 65 + Math.random() * 165;
          state.particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: 2.2 + Math.random() * 3.0,
            color: i % 2 === 0 ? primary : secondary,
            alpha: 1,
            life: 0.95 + Math.random() * 0.55,
            maxLife: 1.5,
            gravity: 110,
            shape: i % 3 === 0 ? "spark" : "confetti",
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 11,
            flipPhase: Math.random() * Math.PI * 2,
            flipSpeed: 7 + Math.random() * 6
          });
        }
        state.rings.push({ x, y, r: 4, maxR: 68, color: primary, alpha: 0.82 });
      }

      function spawnConfettiBurst(count = 95) {
        const colors = ["#fcd34d", "#38f9d7", "#fb7185", "#60a5fa", "#4ade80", "#fde047", "#ffffff"];
        for (let i = 0; i < count; i++) {
          state.particles.push({
            x: layout.w * (0.08 + Math.random() * 0.84),
            y: -12 - Math.random() * 75,
            vx: (Math.random() - 0.5) * 130,
            vy: 55 + Math.random() * 140,
            size: 4.5 + Math.random() * 4.5,
            color: colors[i % colors.length],
            alpha: 1,
            life: 2.6 + Math.random() * 1.4,
            maxLife: 4.0,
            gravity: 58,
            drag: 0.992,
            shape: "confetti",
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 11,
            flipPhase: Math.random() * Math.PI * 2,
            flipSpeed: 6 + Math.random() * 8
          });
        }
      }

      function triggerCameraFlashes(count) {
        const w = layout.w;
        const hy = layout.horizonY;
        for (let i = 0; i < count; i++) {
          const x = Math.random() * w;
          const topY = stadiumArchY(x, w, hy * 0.42, hy * 0.30);
          cameraFlashes.push({
            x,
            y: topY + Math.random() * (hy - topY - 18),
            r: 2.2 + Math.random() * 4.8,
            alpha: 0.95,
            decay: 1.9 + Math.random() * 2.4
          });
        }
      }

      // =========================================================================
      // Shot Resolution & Round Flow
      // =========================================================================
      function resolveShot() {
        const shot = state.shot;
        if (!shot || shot.resolved) return;
        shot.resolved = true;

        const b = state.ball;
        b.x = shot.targetX;
        b.y = shot.targetY;
        b.z = 0;
        b.radius = getGoalBallRadius();

        if (shot.outcome === "goal") {
          state.goals += 1;
          state.streak += 1;
          if (state.streak > state.bestStreak) {
            state.bestStreak = state.streak;
          }
          state.kickResults.push("goal");
          if (state.goals > state.bestScore) {
            state.bestScore = state.goals;
            pulseCard(bestCard);
          }
          saveStats(state.bestScore, state.streak, state.bestStreak);
          pulseCard(goalsCard);
          pulseCard(streakCard);

          Sound.goal();
          triggerNetRipple(shot.nx, shot.ny, 28);
          state.goalGlow = 1;
          state.goalFlashColor = "#38f9d7";
          state.crowdExcitement = 1;
          state.crowdMood = "goal";
          state.ledBannerMode = "goal";
          state.ledBannerTimer = 1.45;
          state.pyroTimer = 0.62;
          state.screenShake = 8.5;
          state.keeper.state = "DEJECTED";
          state.keeper.resultAnimTime = 0;

          b.vx = (shot.nx - 0.5) * 42;
          b.vy = 18;
          b.spinVec = { x: b.spinVec.x * 0.3, y: b.spinVec.y * 0.3, z: b.spinVec.z * 0.3 };

          spawnParticles(shot.targetX, shot.targetY, 32, "#38f9d7", 190, 0.78, "spark");
          spawnParticles(shot.targetX, shot.targetY, 16, "#ffffff", 145, 0.55, "circle");
          spawnParticles(shot.targetX, shot.targetY, 14, "#fde047", 160, 0.68, "confetti");
          state.rings.push({ x: shot.targetX, y: shot.targetY, r: 6, maxR: 72, color: "#38f9d7", alpha: 0.95 });
          triggerCameraFlashes(22);
          showBanner("goal", "GOAL!", shot.detail);
        } else if (shot.outcome === "saved") {
          state.streak = 0;
          saveStats(state.bestScore, state.streak, state.bestStreak);
          state.kickResults.push("saved");

          Sound.save();
          state.goalGlow = 0.8;
          state.goalFlashColor = "#fbbf24";
          state.crowdExcitement = 0.65;
          state.crowdMood = "gasp";
          state.ledBannerMode = "saved";
          state.ledBannerTimer = 1.45;
          state.screenShake = 6.5;
          state.keeper.state = "CELEBRATE";
          state.keeper.resultAnimTime = 0;

          const deflectDir = shot.nx < 0.5 ? -1 : 1;
          b.vx = deflectDir * (145 + Math.random() * 75);
          b.vy = -90 - Math.random() * 55;
          b.spinVec = { x: 12, y: deflectDir * 24, z: deflectDir * 14 };

          spawnParticles(shot.targetX, shot.targetY, 26, "#fbbf24", 175, 0.56, "spark");
          spawnParticles(shot.targetX, shot.targetY, 10, "#ffffff", 110, 0.38, "circle");
          state.rings.push({ x: shot.targetX, y: shot.targetY, r: 6, maxR: 56, color: "#fbbf24", alpha: 0.92 });
          triggerCameraFlashes(12);
          showBanner("saved", "SAVED!", shot.detail);
        } else {
          state.streak = 0;
          saveStats(state.bestScore, state.streak, state.bestStreak);
          state.kickResults.push("miss");

          state.crowdExcitement = 0.55;
          state.crowdMood = "gasp";
          state.ledBannerMode = "miss";
          state.ledBannerTimer = 1.45;

          if (shot.postSide !== 0) {
            Sound.postHit();
            state.screenShake = 9.5;
            state.postVibration = 1;
            state.goalGlow = 0.85;
            state.goalFlashColor = "#fb7185";
            b.vx = shot.postSide * 195;
            b.vy = -125;
            b.spinVec = { x: -16, y: shot.postSide * 28, z: shot.postSide * 18 };
            spawnParticles(shot.targetX, shot.targetY, 28, "#fde047", 205, 0.52, "spark");
            state.rings.push({ x: shot.targetX, y: shot.targetY, r: 4, maxR: 52, color: "#fb7185", alpha: 0.94 });
          } else {
            Sound.miss();
            b.vx = (shot.nx < 0 ? -1 : 1) * 105;
            b.vy = -65;
          }
          showBanner("miss", "OFF TARGET!", shot.detail);
        }

        state.phase = "RESULT";
        state.resultTimer = 1.48;
        updateHUD();
      }

      function pulseCard(el) {
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
      }

      function showBanner(type, title, sub) {
        resultBanner.className = "result-banner " + type;
        bannerTitle.textContent = title;
        bannerSub.textContent = sub;
        requestAnimationFrame(() => {
          resultBanner.classList.add("show");
        });
      }

      function hideBanner() {
        resultBanner.classList.remove("show");
      }

      function updateHUD() {
        goalsVal.textContent = `${state.goals} / ${TOTAL_KICKS}`;
        streakVal.textContent = state.streak >= 3 ? `${state.streak} 🔥` : String(state.streak);
        streakVal.classList.toggle("streak-hot", state.streak >= 2);
        bestVal.textContent = `${state.bestScore} / ${TOTAL_KICKS}`;

        const displayKick = Math.min(state.kickIndex + 1, TOTAL_KICKS);
        kickCounterLabel.textContent = state.phase === "ROUND_OVER"
          ? "Round Complete"
          : `Kick ${displayKick} of ${TOTAL_KICKS}`;

        kickPipsEl.innerHTML = "";
        for (let i = 0; i < TOTAL_KICKS; i++) {
          const pip = document.createElement("div");
          pip.className = "kick-pip";
          const res = state.kickResults[i];
          if (res === "goal") {
            pip.classList.add("goal");
            pip.textContent = "✓";
          } else if (res === "saved") {
            pip.classList.add("saved");
            pip.textContent = "■";
          } else if (res === "miss") {
            pip.classList.add("miss");
            pip.textContent = "✕";
          } else if (i === state.kickIndex && state.phase !== "ROUND_OVER") {
            pip.classList.add("active");
          }
          kickPipsEl.appendChild(pip);
        }

        keeperPill.classList.remove("level-1", "level-2", "level-3");
        if (state.streak >= 5) {
          keeperPill.classList.add("level-3");
          keeperLabel.textContent = "Keeper: Wall";
        } else if (state.streak >= 3) {
          keeperPill.classList.add("level-2");
          keeperLabel.textContent = "Keeper: Locked In";
        } else if (state.streak >= 1) {
          keeperPill.classList.add("level-1");
          keeperLabel.textContent = "Keeper: Sharp";
        } else {
          keeperLabel.textContent = "Keeper: Ready";
        }
      }

      function advanceAfterResult() {
        hideBanner();
        state.kickIndex += 1;

        if (state.kickIndex >= TOTAL_KICKS) {
          finishRound();
          return;
        }

        state.shot = null;
        resetBallToSpot();
        resetKeeper();
        state.reticleTrail = [];
        state.reticlePhaseX = Math.random() * Math.PI * 2;
        state.reticlePhaseY = Math.random() * Math.PI * 2;
        state.phase = "AIMING";
        shootBtn.disabled = false;
        updateHUD();
      }

      function finishRound() {
        state.phase = "ROUND_OVER";
        shootBtn.disabled = true;
        const isPerfect = state.goals === TOTAL_KICKS;
        state.celebrationMode = isPerfect;
        state.fireworkTimer = 0.08;

        roundCard.classList.toggle("perfect", isPerfect);

        if (isPerfect) {
          Sound.perfectFanfare();
          spawnConfettiBurst(120);
          triggerCameraFlashes(32);
          state.crowdExcitement = 1;
          state.crowdMood = "goal";
          state.ledBannerMode = "goal";
          state.ledBannerTimer = 999;
          roundBadge.textContent = "PERFECT ROUND";
          roundHeading.textContent = "5 / 5 FLAWLESS!";
          roundSubtitle.textContent = "Pure ice in your veins. The stadium erupts under the floodlights!";
          trophyWrap.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" fill="rgba(252,211,77,0.24)"></path>
            </svg>`;
        } else {
          roundBadge.textContent = "FULL TIME";
          roundHeading.textContent = `${state.goals} / ${TOTAL_KICKS} Goals`;
          if (state.goals === 4) {
            roundSubtitle.textContent = "So close to perfection! One more corner to find.";
          } else if (state.goals >= 2) {
            roundSubtitle.textContent = "Solid finishing from the penalty spot.";
          } else {
            roundSubtitle.textContent = "The keeper had your number — step back up!";
          }
          trophyWrap.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="#38f9d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <polygon points="12 7.5 15.8 10.3 14.3 14.8 9.7 14.8 8.2 10.3" fill="rgba(56,249,215,0.28)"></polygon>
            </svg>`;
        }

        sumGoals.textContent = `${state.goals}/${TOTAL_KICKS}`;
        sumStreak.textContent = String(state.streak);
        sumBest.textContent = `${state.bestScore}/${TOTAL_KICKS}`;

        summaryPips.innerHTML = "";
        for (let i = 0; i < TOTAL_KICKS; i++) {
          const pip = document.createElement("div");
          pip.className = "kick-pip";
          const res = state.kickResults[i];
          if (res === "goal") {
            pip.classList.add("goal");
            pip.textContent = "✓";
          } else if (res === "saved") {
            pip.classList.add("saved");
            pip.textContent = "■";
          } else {
            pip.classList.add("miss");
            pip.textContent = "✕";
          }
          summaryPips.appendChild(pip);
        }

        updateHUD();
        roundOverlay.classList.add("show");
      }

      function startNewRound() {
        roundOverlay.classList.remove("show");
        hideBanner();
        state.kickIndex = 0;
        state.goals = 0;
        state.kickResults = [];
        state.shot = null;
        state.celebrationMode = false;
        state.particles = [];
        state.rings = [];
        state.goalGlow = 0;
        state.crowdExcitement = 0;
        state.crowdMood = "neutral";
        state.ledBannerMode = "idle";
        state.ledBannerTimer = 0;
        state.postVibration = 0;
        state.pyroTimer = 0;
        state.screenShake = 0;

        for (const node of netNodes) {
          node.dx = 0;
          node.dy = 0;
          node.vx = 0;
          node.vy = 0;
        }
        state.reticleTrail = [];
        state.reticlePhaseX = Math.random() * Math.PI * 2;
        state.reticlePhaseY = Math.random() * Math.PI * 2;
        state.phase = "AIMING";
        resetBallToSpot();
        resetKeeper();
        shootBtn.disabled = false;
        updateHUD();
      }

      // =========================================================================
      // Main Simulation Loop (60fps Fixed-Safe dt)
      // =========================================================================
      function update(dt) {
        if (state.goalGlow > 0) state.goalGlow = Math.max(0, state.goalGlow - dt * 1.25);
        if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 28);
        if (state.postVibration > 0) state.postVibration = Math.max(0, state.postVibration - dt * 2.6);
        if (state.crowdExcitement > 0 && !state.celebrationMode) {
          state.crowdExcitement = Math.max(0, state.crowdExcitement - dt * 0.62);
        }
        if (state.ledBannerTimer > 0) {
          state.ledBannerTimer -= dt;
          if (state.ledBannerTimer <= 0) state.ledBannerMode = "idle";
        }
        if (state.pyroTimer > 0) {
          state.pyroTimer -= dt;
          if (Math.random() < dt * 22) spawnGoalPyro();
        }

        // Net spring physics
        for (const node of netNodes) {
          const kSpring = 48;
          const damping = 5.2;
          const ax = -kSpring * node.dx - damping * node.vx;
          const ay = -kSpring * node.dy - damping * node.vy;
          node.vx += ax * dt;
          node.vy += ay * dt;
          node.dx += node.vx * dt;
          node.dy += node.vy * dt;
        }

        // Drifting illuminated dust motes
        for (const m of dustMotes) {
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          if (m.y < 0) {
            m.y = layout.horizonY + 55;
            m.x = Math.random() * layout.w;
          }
          if (m.x < 0) m.x = layout.w;
          if (m.x > layout.w) m.x = 0;
        }

        // Ambient stadium camera flashes
        if (Math.random() < dt * (state.celebrationMode ? 14 : 2.6)) {
          triggerCameraFlashes(1);
        }
        for (let i = cameraFlashes.length - 1; i >= 0; i--) {
          cameraFlashes[i].alpha -= cameraFlashes[i].decay * dt;
          if (cameraFlashes[i].alpha <= 0) cameraFlashes.splice(i, 1);
        }

        // Reticle sweep during AIMING
        if (state.phase === "AIMING") {
          const speedScale = 1 + Math.min(0.62, state.streak * 0.085);
          state.reticlePhaseX += dt * 2.15 * speedScale;
          state.reticlePhaseY += dt * 1.32 * speedScale;

          state.reticleNx = 0.5 + Math.sin(state.reticlePhaseX) * 0.61;
          state.reticleNy = 0.49 + Math.sin(state.reticlePhaseY) * 0.34;

          const g = layout.goal;
          state.reticleTrail.push({
            x: g.x + state.reticleNx * g.w,
            y: g.y + state.reticleNy * g.h
          });
          if (state.reticleTrail.length > 12) state.reticleTrail.shift();

          state.keeper.idleTime += dt;
          state.keeper.pose = computeKeeperPose(0);
        }

        // Ball flight & keeper dive
        if (state.phase === "FLIGHT" && state.shot) {
          const shot = state.shot;
          shot.elapsed += dt;
          const t = Math.min(1, shot.elapsed / shot.duration);
          const easeT = 1 - Math.pow(1 - t, 1.55);

          const startR = getSpotBallRadius();
          const endR = getGoalBallRadius();

          const b = state.ball;
          const swerveOffset = Math.sin(t * Math.PI) * shot.swerve;
          b.x = shot.startX + (shot.targetX - shot.startX) * easeT + swerveOffset;
          const linearY = shot.startY + (shot.targetY - shot.startY) * easeT;
          b.z = Math.sin(t * Math.PI) * shot.arcHeight;
          b.y = linearY - b.z;
          b.radius = startR + (endR - startR) * easeT;
          b.rotMat = rotateMat3(b.rotMat, b.spinVec.x, b.spinVec.y, b.spinVec.z, dt);

          b.trail.push({ x: b.x, y: b.y, r: b.radius });
          if (b.trail.length > 14) b.trail.shift();

          const k = state.keeper;
          const diveElapsed = Math.max(0, shot.elapsed - k.diveDelay);
          k.diveProgress = Math.min(1, diveElapsed / k.diveDuration);
          k.pose = computeKeeperPose(k.diveProgress);

          // Kick up grass on keeper dive takeoff & landing
          if (!k.landedDustDone && k.diveProgress > 0.84 && k.diveDir !== 0 && k.pose) {
            k.landedDustDone = true;
            spawnTurfBurst(k.pose.hipX, layout.goal.y + layout.goal.h, 8, 0.55);
          }

          if (t >= 1) {
            resolveShot();
          }
        }

        // Post-impact motion during RESULT
        if (state.phase === "RESULT") {
          const shot = state.shot;
          const b = state.ball;
          const g = layout.goal;
          const k = state.keeper;

          k.resultAnimTime += dt;
          if (k.diveProgress < 1) {
            k.diveProgress = Math.min(1, k.diveProgress + dt / k.diveDuration);
          }
          k.pose = computeKeeperPose(k.diveProgress);

          if (shot.outcome === "goal") {
            b.x += b.vx * dt;
            b.vy += 430 * dt;
            b.y += b.vy * dt;
            const floorY = g.y + g.h - b.radius * 0.65;
            if (b.y > floorY) {
              b.y = floorY;
              b.vy *= -0.36;
              b.vx *= 0.82;
            }
            const minX = g.x + g.backInsetX + b.radius;
            const maxX = g.x + g.w - g.backInsetX - b.radius;
            if (b.x < minX) { b.x = minX; b.vx *= -0.5; }
            if (b.x > maxX) { b.x = maxX; b.vx *= -0.5; }
            b.rotMat = rotateMat3(b.rotMat, b.vy * 0.04, b.vx * 0.09, b.vx * 0.05, dt);
          } else {
            b.x += b.vx * dt;
            b.vy += 490 * dt;
            b.y += b.vy * dt;
            b.rotMat = rotateMat3(b.rotMat, b.spinVec.x, b.spinVec.y, b.spinVec.z, dt);
          }

          if (b.trail.length > 0) b.trail.shift();

          state.resultTimer -= dt;
          if (state.resultTimer <= 0) {
            advanceAfterResult();
          }
        }

        // Perfect 5/5 celebration fireworks + cascading confetti
        if (state.phase === "ROUND_OVER" && state.celebrationMode) {
          state.fireworkTimer -= dt;
          if (state.fireworkTimer <= 0) {
            spawnFirework(
              layout.w * (0.15 + Math.random() * 0.7),
              layout.h * (0.1 + Math.random() * 0.3)
            );
            if (Math.random() < 0.45) spawnConfettiBurst(26);
            state.fireworkTimer = 0.46 + Math.random() * 0.46;
          }
        }

        // Update particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            state.particles.splice(i, 1);
            continue;
          }
          if (p.drag) {
            p.vx *= p.drag;
            p.vy *= p.drag;
          }
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.rot !== undefined) p.rot += p.vrot * dt;
          if (p.flipPhase !== undefined) p.flipPhase += p.flipSpeed * dt;
          p.alpha = Math.max(0, Math.min(1, (p.life / p.maxLife) * 1.25));
        }

        // Update shockwave rings
        for (let i = state.rings.length - 1; i >= 0; i--) {
          const r = state.rings[i];
          r.r += (r.maxR - r.r) * Math.min(1, dt * 8.5);
          r.alpha -= dt * 2.0;
          if (r.alpha <= 0) state.rings.splice(i, 1);
        }
      }

      // =========================================================================
      // High-Detail Canvas Rendering Pipeline
      // =========================================================================
      function drawDynamicStadiumAtmosphere(nowSec) {
        const w = layout.w;
        const hy = layout.horizonY;

        // 1. Twinkling stars in upper night sky
        for (const s of stars) {
          const a = 0.22 + 0.62 * (0.5 + 0.5 * Math.sin(nowSec * s.speed + s.twinkle));
          ctx.fillStyle = `rgba(218, 238, 255, ${a.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Animated Spectators in Upper & Lower Grandstands (color-batched for 60fps)
        const excite = state.crowdExcitement;
        const isGoalCheer = state.crowdMood === "goal" && excite > 0.05;
        const isGasp = state.crowdMood === "gasp" && excite > 0.05;

        for (let i = 0; i < crowd.length; i++) {
          const p = crowd[i];
          let jump = Math.sin(nowSec * p.speed + p.phase) * 0.55;
          if (isGoalCheer) {
            const stadiumWave = Math.sin(nowSec * 14 - Math.abs(p.x - w * 0.5) * 0.025 + p.phase);
            jump = -Math.abs(stadiumWave) * (4.8 * excite) - 1.5 * excite;
          } else if (isGasp) {
            jump = -Math.abs(Math.sin(nowSec * 9 + p.phase)) * (2.2 * excite);
          }
          p.py = p.y + jump;
        }

        // Batched jerseys / shoulders
        for (let b = 0; b < crowdByJersey.length; b++) {
          const [color, list] = crowdByJersey[b];
          ctx.fillStyle = color;
          ctx.beginPath();
          for (let i = 0; i < list.length; i++) {
            const p = list[i];
            const r = p.scale * 0.95;
            const cy = p.py + p.scale * 0.55;
            ctx.moveTo(p.x - r, cy);
            ctx.arc(p.x, cy, r, Math.PI, 0);
          }
          ctx.fill();
        }

        // Batched spectator heads
        for (let b = 0; b < crowdBySkin.length; b++) {
          const [color, list] = crowdBySkin[b];
          ctx.fillStyle = color;
          ctx.beginPath();
          for (let i = 0; i < list.length; i++) {
            const p = list[i];
            const r = p.scale * 0.48;
            const cy = p.py - p.scale * 0.25;
            ctx.moveTo(p.x + r, cy);
            ctx.arc(p.x, cy, r, 0, Math.PI * 2);
          }
          ctx.fill();
        }

        // Batched raised supporter scarves
        ctx.lineWidth = 1.6;
        for (let b = 0; b < crowdByScarf.length; b++) {
          const [color, list] = crowdByScarf[b];
          ctx.strokeStyle = color;
          ctx.beginPath();
          for (let i = 0; i < list.length; i++) {
            const p = list[i];
            if (!isGoalCheer && Math.sin(nowSec * 1.4 + p.phase) <= 0.65) continue;
            const s = p.scale;
            const lift = isGoalCheer ? s * 1.25 : s * 0.85;
            const sway = Math.sin(nowSec * (isGoalCheer ? 14 : 4) + p.phase) * s * 0.5;
            ctx.moveTo(p.x - s * 0.95, p.py - lift + sway * 0.4);
            ctx.lineTo(p.x + s * 0.95, p.py - lift - sway * 0.4);
          }
          ctx.stroke();
        }

        // Waving supporter flags in lower stand
        for (const f of flags) {
          const amp = isGoalCheer ? 1.8 : 0.7;
          const sway = Math.sin(nowSec * (isGoalCheer ? 10 : 3.2) + f.phase) * 4 * amp;
          ctx.save();
          ctx.strokeStyle = "rgba(226, 232, 240, 0.55)";
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(f.x, f.y + 8);
          ctx.lineTo(f.x + sway * 0.35, f.y - f.size);
          ctx.stroke();

          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.moveTo(f.x + sway * 0.35, f.y - f.size);
          ctx.quadraticCurveTo(
            f.x + f.size * 0.65 + sway * 0.5, f.y - f.size + sway * 0.35,
            f.x + f.size * 1.15 + sway, f.y - f.size * 0.65
          );
          ctx.lineTo(f.x + sway * 0.25, f.y - f.size * 0.35);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Camera flashes & stadium phone lights in the crowd
        for (const f of cameraFlashes) {
          const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 3.8);
          grad.addColorStop(0, `rgba(255, 255, 255, ${f.alpha.toFixed(2)})`);
          grad.addColorStop(0.35, `rgba(191, 219, 254, ${(f.alpha * 0.45).toFixed(2)})`);
          grad.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 3.8, 0, Math.PI * 2);
          ctx.fill();
        }

        // 3. Animated Pitchside LED Perimeter Boards
        drawLedPerimeterBoards(nowSec);

        // 4. Volumetric Floodlight Beams, Lamp Arrays & Anamorphic Lens Flare
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        const pulseGlow = 1 + state.goalGlow * 0.28;

        for (const fl of layout.floodlights) {
          const spreadTop = 14 * fl.scale;
          const spreadBot = w * (0.28 * fl.scale);
          const beam = ctx.createLinearGradient(fl.x, fl.y, fl.aimX, fl.aimY);
          beam.addColorStop(0, `rgba(205, 236, 255, ${(0.20 * pulseGlow).toFixed(3)})`);
          beam.addColorStop(0.45, `rgba(140, 205, 255, ${(0.075 * pulseGlow).toFixed(3)})`);
          beam.addColorStop(1, "rgba(120, 190, 255, 0)");

          ctx.fillStyle = beam;
          ctx.beginPath();
          ctx.moveTo(fl.x - spreadTop, fl.y);
          ctx.lineTo(fl.x + spreadTop, fl.y);
          ctx.lineTo(fl.aimX + spreadBot, fl.aimY);
          ctx.lineTo(fl.aimX - spreadBot, fl.aimY);
          ctx.closePath();
          ctx.fill();

          // Soft halo bloom around lamp bank
          const haloR = 38 * fl.scale * pulseGlow;
          const halo = ctx.createRadialGradient(fl.x, fl.y, 1, fl.x, fl.y, haloR);
          halo.addColorStop(0, "rgba(255, 255, 255, 0.98)");
          halo.addColorStop(0.28, "rgba(204, 238, 255, 0.62)");
          halo.addColorStop(0.62, "rgba(125, 211, 252, 0.16)");
          halo.addColorStop(1, "rgba(125, 211, 252, 0)");
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(fl.x, fl.y, haloR, 0, Math.PI * 2);
          ctx.fill();

          // Horizontal anamorphic stadium lens flare streak
          const streakW = 58 * fl.scale * pulseGlow;
          const streak = ctx.createLinearGradient(fl.x - streakW, fl.y, fl.x + streakW, fl.y);
          streak.addColorStop(0, "rgba(147, 197, 253, 0)");
          streak.addColorStop(0.5, "rgba(224, 242, 254, 0.55)");
          streak.addColorStop(1, "rgba(147, 197, 253, 0)");
          ctx.fillStyle = streak;
          ctx.fillRect(fl.x - streakW, fl.y - 1.2, streakW * 2, 2.4);

          // Crisp individual halogen bulbs in the lamp rack
          ctx.fillStyle = "#ffffff";
          const cols = 4;
          const rows = 2;
          const bw = 24 * fl.scale;
          const bh = 8 * fl.scale;
          for (let r = 0; r < rows; r++) {
            for (let cl = 0; cl < cols; cl++) {
              const bx = fl.x - bw * 0.5 + (cl + 0.5) * (bw / cols);
              const by = fl.y - bh * 0.5 + (r + 0.5) * (bh / rows);
              ctx.beginPath();
              ctx.arc(bx, by, 1.8 * fl.scale, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // Gently drifting illuminated dust/mist motes
        for (const m of dustMotes) {
          const twinkle = 0.5 + 0.5 * Math.sin(nowSec * 2.2 + m.phase);
          ctx.fillStyle = `rgba(215, 240, 255, ${(m.alpha * twinkle).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawLedPerimeterBoards(nowSec) {
        const w = layout.w;
        const hy = layout.horizonY;
        const boardH = 14;
        const y = hy - boardH;

        ctx.save();
        ctx.fillStyle = "#061024";
        ctx.fillRect(0, y, w, boardH);

        let accent = "#38bdf8";
        let bgGlow = "rgba(14, 165, 233, 0.26)";
        let label = "NIGHT CUP  •  PENALTY SHOOTOUT  •  ";

        if (state.ledBannerMode === "goal") {
          const flash = Math.sin(nowSec * 24) > 0;
          accent = flash ? "#38f9d7" : "#fde047";
          bgGlow = "rgba(16, 185, 129, 0.42)";
          label = "★  GOAL!  ★  GOAL!  ★  ";
        } else if (state.ledBannerMode === "saved") {
          accent = "#fbbf24";
          bgGlow = "rgba(245, 158, 11, 0.35)";
          label = "GLOVE SAVE!  •  DENIED!  •  ";
        } else if (state.ledBannerMode === "miss") {
          accent = "#fb7185";
          bgGlow = "rgba(244, 63, 94, 0.32)";
          label = "OFF TARGET  •  CLOSE CALL  •  ";
        }

        ctx.fillStyle = bgGlow;
        ctx.fillRect(0, y + 1, w, boardH - 2);

        // Scrolling LED text clipped inside perimeter board
        ctx.beginPath();
        ctx.rect(0, y, w, boardH);
        ctx.clip();

        ctx.font = "900 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        ctx.fillStyle = accent;
        ctx.textBaseline = "middle";
        const speed = state.ledBannerMode === "goal" ? 72 : 28;
        const unitW = ctx.measureText(label).width;
        const offset = -((nowSec * speed) % unitW);
        for (let tx = offset; tx < w + unitW; tx += unitW) {
          ctx.fillText(label, tx, y + boardH * 0.54);
        }

        // Top glowing rail edge
        ctx.fillStyle = accent;
        ctx.globalAlpha = 0.7;
        ctx.fillRect(0, y, w, 1.5);
        ctx.restore();
      }

      // =========================================================================
      // Realistic 3D Goal Cage, Net Mesh & Shaded Tubular Posts
      // =========================================================================
      function drawGoalNet(nowSec) {
        const g = layout.goal;
        const vib = state.postVibration > 0.01 ? Math.sin(nowSec * 80) * state.postVibration * 2.2 : 0;
        const gx = g.x + vib;
        const gy = g.y;
        const bx = gx + g.backInsetX;
        const by = gy + g.backInsetY;
        const bw = g.w - g.backInsetX * 2;
        const bh = g.h - g.backInsetY;

        // Subtle shaded interior backdrop inside goal mouth for high contrast
        const innerGrad = ctx.createLinearGradient(0, gy, 0, gy + g.h);
        innerGrad.addColorStop(0, "rgba(3, 10, 24, 0.72)");
        innerGrad.addColorStop(0.75, "rgba(5, 18, 28, 0.52)");
        innerGrad.addColorStop(1, "rgba(6, 26, 20, 0.40)");
        ctx.fillStyle = innerGrad;
        ctx.fillRect(gx, gy, g.w, g.h);

        // Soft interior goal celebration glow
        if (state.goalGlow > 0.04) {
          const gGlow = ctx.createRadialGradient(
            gx + g.w * 0.5, gy + g.h * 0.5, g.h * 0.1,
            gx + g.w * 0.5, gy + g.h * 0.5, g.w * 0.65
          );
          gGlow.addColorStop(0, state.goalFlashColor);
          gGlow.addColorStop(1, "rgba(0,0,0,0)");
          ctx.save();
          ctx.globalAlpha = state.goalGlow * 0.28;
          ctx.fillStyle = gGlow;
          ctx.fillRect(gx, gy, g.w, g.h);
          ctx.restore();
        }

        function netPt(r, c) {
          const node = netNodes[r * (NET_COLS + 1) + c];
          return {
            x: bx + node.u * bw + node.dx,
            y: by + node.v * bh + node.dy
          };
        }

        ctx.save();

        // Back metal stanchion support tubes & ground frame
        ctx.strokeStyle = "rgba(155, 188, 222, 0.48)";
        ctx.lineWidth = 2.6;
        ctx.lineJoin = "round";
        ctx.beginPath();
        // Ground support rail
        ctx.moveTo(gx, gy + g.h);
        ctx.lineTo(bx, by + bh);
        ctx.lineTo(bx + bw, by + bh);
        ctx.lineTo(gx + g.w, gy + g.h);
        // Back vertical stanchions
        ctx.moveTo(bx, by + bh);
        ctx.lineTo(bx, by);
        ctx.lineTo(bx + bw, by);
        ctx.lineTo(bx + bw, by + bh);
        // Top angled D-brackets
        ctx.moveTo(gx, gy);
        ctx.lineTo(bx, by);
        ctx.moveTo(gx + g.w, gy);
        ctx.lineTo(bx + bw, by);
        ctx.stroke();

        // Braided Nylon Net Mesh (side walls, roof, and spring-animated back wall)
        const baseAlpha = 0.34 + state.goalGlow * 0.35;
        ctx.strokeStyle = state.goalGlow > 0.12
          ? `rgba(175, 255, 238, ${Math.min(0.88, baseAlpha + 0.12).toFixed(2)})`
          : `rgba(218, 236, 250, ${baseAlpha.toFixed(2)})`;
        ctx.lineWidth = 1.05;

        // Side & roof depth lines
        const depthSteps = 6;
        for (let i = 1; i < depthSteps; i++) {
          const t = i / depthSteps;
          const xL = gx + g.backInsetX * t;
          const xR = gx + g.w - g.backInsetX * t;
          const yTop = gy + g.backInsetY * t;
          ctx.beginPath();
          // Left side vertical
          ctx.moveTo(xL, yTop);
          ctx.lineTo(xL, gy + g.h);
          // Right side vertical
          ctx.moveTo(xR, yTop);
          ctx.lineTo(xR, gy + g.h);
          // Roof horizontal
          ctx.moveTo(xL, yTop);
          ctx.lineTo(xR, yTop);
          ctx.stroke();
        }

        // Side horizontal net strands
        for (let r = 0; r <= NET_ROWS; r++) {
          const frontY = gy + (r / NET_ROWS) * g.h;
          const leftBack = netPt(r, 0);
          const rightBack = netPt(r, NET_COLS);
          ctx.beginPath();
          ctx.moveTo(gx, frontY);
          ctx.lineTo(leftBack.x, leftBack.y);
          ctx.moveTo(gx + g.w, frontY);
          ctx.lineTo(rightBack.x, rightBack.y);
          ctx.stroke();
        }

        // Roof longitudinal net strands
        for (let c = 1; c < NET_COLS; c++) {
          const frontX = gx + (c / NET_COLS) * g.w;
          const topBack = netPt(0, c);
          ctx.beginPath();
          ctx.moveTo(frontX, gy);
          ctx.lineTo(topBack.x, topBack.y);
          ctx.stroke();
        }

        // Back net mesh with dynamic ripple
        for (let r = 0; r <= NET_ROWS; r++) {
          ctx.beginPath();
          for (let c = 0; c <= NET_COLS; c++) {
            const pt = netPt(r, c);
            if (c === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();
        }
        for (let c = 0; c <= NET_COLS; c++) {
          ctx.beginPath();
          for (let r = 0; r <= NET_ROWS; r++) {
            const pt = netPt(r, c);
            if (r === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawGoalFrame(nowSec) {
        const g = layout.goal;
        const vib = state.postVibration > 0.01 ? Math.sin(nowSec * 80) * state.postVibration * 2.2 : 0;
        const gx = g.x + vib;
        const gy = g.y;
        const postW = Math.max(7, g.h * 0.062);

        ctx.save();

        // Subtle stadium bloom on posts when goal/post hit happens
        if (state.goalGlow > 0.05) {
          ctx.shadowColor = state.goalFlashColor;
          ctx.shadowBlur = 14 + state.goalGlow * 22;
        } else {
          ctx.shadowColor = "rgba(186, 230, 255, 0.35)";
          ctx.shadowBlur = 10;
        }

        // Left cylindrical steel post
        const leftGrad = ctx.createLinearGradient(gx - postW * 0.5, 0, gx + postW * 0.5, 0);
        leftGrad.addColorStop(0, "#94a3b8");
        leftGrad.addColorStop(0.32, "#ffffff");
        leftGrad.addColorStop(0.68, "#e2e8f0");
        leftGrad.addColorStop(1, "#64748b");
        ctx.fillStyle = leftGrad;
        ctx.fillRect(gx - postW * 0.5, gy - postW * 0.5, postW, g.h + postW * 0.5);

        // Right cylindrical steel post
        const rightGrad = ctx.createLinearGradient(gx + g.w - postW * 0.5, 0, gx + g.w + postW * 0.5, 0);
        rightGrad.addColorStop(0, "#64748b");
        rightGrad.addColorStop(0.32, "#e2e8f0");
        rightGrad.addColorStop(0.68, "#ffffff");
        rightGrad.addColorStop(1, "#94a3b8");
        ctx.fillStyle = rightGrad;
        ctx.fillRect(gx + g.w - postW * 0.5, gy - postW * 0.5, postW, g.h + postW * 0.5);

        // Cylindrical crossbar
        const barGrad = ctx.createLinearGradient(0, gy - postW * 0.5, 0, gy + postW * 0.5);
        barGrad.addColorStop(0, "#cbd5e1");
        barGrad.addColorStop(0.3, "#ffffff");
        barGrad.addColorStop(0.72, "#e2e8f0");
        barGrad.addColorStop(1, "#64748b");
        ctx.fillStyle = barGrad;
        roundedRectPath(ctx, gx - postW * 0.5, gy - postW * 0.5, g.w + postW, postW, postW * 0.45);
        ctx.fill();

        // Crisp metallic floodlight specular line along crossbar top
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fillRect(gx, gy - postW * 0.24, g.w, postW * 0.18);

        // Ground base collars
        ctx.fillStyle = "#334155";
        ctx.fillRect(gx - postW * 0.62, gy + g.h - 2, postW * 1.24, 3.5);
        ctx.fillRect(gx + g.w - postW * 0.62, gy + g.h - 2, postW * 1.24, 3.5);

        ctx.restore();
      }

      // =========================================================================
      // Articulated Shaded Goalkeeper Renderer
      // =========================================================================
      function drawLimbSegment(ax, ay, bx, by, wStart, wEnd, color) {
        const dx = bx - ax;
        const dy = by - ay;
        const len = Math.hypot(dx, dy);
        if (len < 0.1) return;
        const nx = -dy / len;
        const ny = dx / len;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(ax + nx * wStart * 0.5, ay + ny * wStart * 0.5);
        ctx.lineTo(bx + nx * wEnd * 0.5, by + ny * wEnd * 0.5);
        ctx.lineTo(bx - nx * wEnd * 0.5, by - ny * wEnd * 0.5);
        ctx.lineTo(ax - nx * wStart * 0.5, ay - ny * wStart * 0.5);
        ctx.closePath();
        ctx.fill();
      }

      function drawGoalkeeper() {
        const p = state.keeper.pose || computeKeeperPose(0);
        const u = p.unit;
        const g = layout.goal;

        ctx.save();

        // Dynamic soft turf shadow under keeper
        const shadowCenterX = (p.hipX + p.shoulderX) * 0.5;
        const shadowSpread = state.keeper.diveDir !== 0 ? u * 1.05 : u * 0.62;
        const shadowAlpha = Math.max(0.16, 0.44 - p.airborne * 0.22);
        const shadowGrad = ctx.createRadialGradient(
          shadowCenterX, g.y + g.h + 3, 2,
          shadowCenterX, g.y + g.h + 3, shadowSpread
        );
        shadowGrad.addColorStop(0, `rgba(0, 0, 0, ${shadowAlpha.toFixed(2)})`);
        shadowGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.ellipse(shadowCenterX, g.y + g.h + 3, shadowSpread, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Kit colors intensify slightly with player's streak (matches keeper alertness)
        const jerseyMain = state.streak >= 5 ? "#f43f5e" : state.streak >= 3 ? "#f59e0b" : "#fb923c";
        const jerseyDark = state.streak >= 5 ? "#9f1239" : state.streak >= 3 ? "#b45309" : "#c2410c";
        const jerseyHighlight = state.streak >= 5 ? "#fda4af" : state.streak >= 3 ? "#fde68a" : "#fed7aa";

        // 1. Legs: shorts -> thighs -> knees -> striped socks -> boots
        const shortsColor = "#0f172a";
        const sockColor = "#f1f5f9";
        const skinColor = "#e7b580";

        // Calves / Socks
        drawLimbSegment(p.leftKneeX, p.leftKneeY, p.leftFootX, p.leftFootY, u * 0.16, u * 0.11, sockColor);
        drawLimbSegment(p.rightKneeX, p.rightKneeY, p.rightFootX, p.rightFootY, u * 0.16, u * 0.11, sockColor);

        // Sock top accent stripes
        ctx.strokeStyle = jerseyMain;
        ctx.lineWidth = Math.max(1.8, u * 0.045);
        [
          [p.leftKneeX, p.leftKneeY, p.leftFootX, p.leftFootY],
          [p.rightKneeX, p.rightKneeY, p.rightFootX, p.rightFootY]
        ].forEach(([kx, ky, fx, fy]) => {
          const sx = kx + (fx - kx) * 0.25;
          const sy = ky + (fy - ky) * 0.25;
          ctx.beginPath();
          ctx.arc(sx, sy, u * 0.065, 0, Math.PI * 2);
          ctx.stroke();
        });

        // Knees
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.arc(p.leftKneeX, p.leftKneeY, u * 0.075, 0, Math.PI * 2);
        ctx.arc(p.rightKneeX, p.rightKneeY, u * 0.075, 0, Math.PI * 2);
        ctx.fill();

        // Thighs / Shorts
        drawLimbSegment(p.hipX, p.hipY, p.leftKneeX, p.leftKneeY, u * 0.24, u * 0.17, shortsColor);
        drawLimbSegment(p.hipX, p.hipY, p.rightKneeX, p.rightKneeY, u * 0.24, u * 0.17, shortsColor);

        // Cleated soccer boots
        const bootR = Math.max(3.6, u * 0.115);
        [
          [p.leftFootX, p.leftFootY, -1],
          [p.rightFootX, p.rightFootY, 1]
        ].forEach(([fx, fy, side]) => {
          ctx.fillStyle = "#0b1324";
          ctx.beginPath();
          ctx.ellipse(fx + side * 1.5, fy, bootR * 1.2, bootR * 0.72, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#38f9d7";
          ctx.beginPath();
          ctx.ellipse(fx + side * 2, fy - 0.5, bootR * 0.72, bootR * 0.36, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // 2. Athletic Shaded Torso Jersey (broad shoulders, tapered waist)
        const tx = p.shoulderX - p.hipX;
        const ty = p.shoulderY - p.hipY;
        const tLen = Math.max(1, Math.hypot(tx, ty));
        const perpX = -ty / tLen;
        const perpY = tx / tLen;

        const shHalf = u * 0.285;
        const hipHalf = u * 0.195;

        const torsoGrad = ctx.createLinearGradient(
          p.shoulderX - perpX * shHalf, p.shoulderY - perpY * shHalf,
          p.hipX + perpX * hipHalf, p.hipY + perpY * hipHalf
        );
        torsoGrad.addColorStop(0, jerseyHighlight);
        torsoGrad.addColorStop(0.28, jerseyMain);
        torsoGrad.addColorStop(1, jerseyDark);

        ctx.fillStyle = torsoGrad;
        ctx.beginPath();
        ctx.moveTo(p.shoulderX - perpX * shHalf, p.shoulderY - perpY * shHalf);
        ctx.lineTo(p.shoulderX + perpX * shHalf, p.shoulderY + perpY * shHalf);
        ctx.lineTo(p.hipX + perpX * hipHalf, p.hipY + perpY * hipHalf);
        ctx.lineTo(p.hipX - perpX * hipHalf, p.hipY - perpY * hipHalf);
        ctx.closePath();
        ctx.fill();

        // Athletic V-stripe & chest graphic on jersey
        ctx.strokeStyle = "rgba(15, 23, 42, 0.55)";
        ctx.lineWidth = Math.max(2.2, u * 0.065);
        const midX = (p.shoulderX + p.hipX) * 0.5;
        const midY = (p.shoulderY + p.hipY) * 0.5;
        ctx.beginPath();
        ctx.moveTo(p.shoulderX - perpX * shHalf * 0.72, p.shoulderY - perpY * shHalf * 0.72);
        ctx.lineTo(midX, midY);
        ctx.lineTo(p.shoulderX + perpX * shHalf * 0.72, p.shoulderY + perpY * shHalf * 0.72);
        ctx.stroke();

        // Collar trim
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(p.shoulderX, p.shoulderY, u * 0.1, 0, Math.PI * 2);
        ctx.fill();

        // 3. Articulated Arms (Upper arm sleeves + forearms)
        const shL_X = p.shoulderX - perpX * shHalf * 0.78;
        const shL_Y = p.shoulderY - perpY * shHalf * 0.78;
        const shR_X = p.shoulderX + perpX * shHalf * 0.78;
        const shR_Y = p.shoulderY + perpY * shHalf * 0.78;

        // Upper arms
        drawLimbSegment(shL_X, shL_Y, p.leftElbowX, p.leftElbowY, u * 0.17, u * 0.13, jerseyMain);
        drawLimbSegment(shR_X, shR_Y, p.rightElbowX, p.rightElbowY, u * 0.17, u * 0.13, jerseyMain);
        // Forearms (long-sleeve keeper kit with dark cuff)
        drawLimbSegment(p.leftElbowX, p.leftElbowY, p.leftHandX, p.leftHandY, u * 0.135, u * 0.105, jerseyDark);
        drawLimbSegment(p.rightElbowX, p.rightElbowY, p.rightHandX, p.rightHandY, u * 0.135, u * 0.105, jerseyDark);

        // 4. Detailed Padded Goalkeeper Gloves
        const gloveR = Math.max(5.2, u * 0.155);
        [
          [p.leftHandX, p.leftHandY, p.leftElbowX, p.leftElbowY],
          [p.rightHandX, p.rightHandY, p.rightElbowX, p.rightElbowY]
        ].forEach(([hx, hy, ex, ey]) => {
          const ang = Math.atan2(hy - ey, hx - ex);
          ctx.save();
          ctx.translate(hx, hy);
          ctx.rotate(ang);

          // Subtle floodlight glow on bright latex gloves
          ctx.shadowColor = "rgba(56, 249, 215, 0.55)";
          ctx.shadowBlur = 8;

          // Wrist strap
          ctx.fillStyle = "#0284c7";
          ctx.fillRect(-gloveR * 1.1, -gloveR * 0.55, gloveR * 0.6, gloveR * 1.1);

          // Padded white latex palm
          ctx.fillStyle = "#f8fafc";
          ctx.strokeStyle = "#0ea5e9";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.ellipse(gloveR * 0.1, 0, gloveR * 1.05, gloveR * 0.82, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Grip accent panel
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#38f9d7";
          ctx.beginPath();
          ctx.ellipse(gloveR * 0.2, 0, gloveR * 0.45, gloveR * 0.38, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // 5. Shaded Head & Hair
        const headR = Math.max(6.4, u * 0.22);
        const headGrad = ctx.createRadialGradient(
          p.headX - headR * 0.28, p.headY - headR * 0.28, headR * 0.1,
          p.headX, p.headY, headR
        );
        headGrad.addColorStop(0, "#fbd3a2");
        headGrad.addColorStop(0.72, "#e5ad76");
        headGrad.addColorStop(1, "#b47843");
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(p.headX, p.headY, headR, 0, Math.PI * 2);
        ctx.fill();

        // Styled short hair cap
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.arc(p.headX, p.headY - headR * 0.16, headR * 0.98, Math.PI * 1.02, Math.PI * 1.98);
        ctx.quadraticCurveTo(p.headX, p.headY - headR * 0.35, p.headX - headR * 0.96, p.headY - headR * 0.12);
        ctx.closePath();
        ctx.fill();

        // Focused eyes looking toward penalty spot / ball
        const lookX = state.keeper.diveDir * headR * 0.22;
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(p.headX - headR * 0.28 + lookX, p.headY + headR * 0.08, Math.max(1.1, headR * 0.12), 0, Math.PI * 2);
        ctx.arc(p.headX + headR * 0.28 + lookX, p.headY + headR * 0.08, Math.max(1.1, headR * 0.12), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // =========================================================================
      // Tactical Broadcast Aim Reticle
      // =========================================================================
      function drawReticle(nowSec) {
        if (state.phase !== "AIMING") return;

        const g = layout.goal;
        const nx = state.reticleNx;
        const ny = state.reticleNy;
        const x = g.x + nx * g.w;
        const y = g.y + ny * g.h;

        let color = "#38f9d7";
        let zoneHint = null;
        if (nx < -0.036 || nx > 1.036) {
          color = "#fb7185";
        } else if (nx < 0.032 || nx > 0.968) {
          color = "#fbbf24";
        } else if (ny < 0.34 && (nx < 0.26 || nx > 0.74)) {
          color = "#67e8f9";
          zoneHint = "TOP BINS";
        }

        // Smooth glowing motion ribbon trail
        for (let i = 0; i < state.reticleTrail.length; i++) {
          const pt = state.reticleTrail[i];
          const frac = (i + 1) / state.reticleTrail.length;
          ctx.fillStyle = color;
          ctx.globalAlpha = frac * 0.24;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 1.8 + frac * 3.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        const pulse = 1 + Math.sin(nowSec * 9.5) * 0.07;
        const r = Math.max(16, g.h * 0.145) * pulse;

        ctx.save();
        ctx.translate(x, y);
        ctx.shadowColor = color;
        ctx.shadowBlur = 16;

        // Rotating dashed inner telemetry ring
        ctx.save();
        ctx.rotate(nowSec * 1.8);
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.65;
        ctx.lineWidth = 1.6;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.66, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Outer solid bracket arcs
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.6;
        for (let q = 0; q < 4; q++) {
          const a0 = q * (Math.PI / 2) + 0.25;
          const a1 = a0 + Math.PI / 2 - 0.5;
          ctx.beginPath();
          ctx.arc(0, 0, r, a0, a1);
          ctx.stroke();
        }

        // Precision crosshair ticks
        const inner = r * 0.38;
        const outer = r * 1.38;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(-outer, 0); ctx.lineTo(-inner, 0);
        ctx.moveTo(inner, 0);  ctx.lineTo(outer, 0);
        ctx.moveTo(0, -outer); ctx.lineTo(0, -inner);
        ctx.moveTo(0, inner);  ctx.lineTo(0, outer);
        ctx.stroke();

        // Bright center bead
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
        ctx.fill();

        if (zoneHint) {
          ctx.shadowBlur = 6;
          ctx.font = "900 8px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
          ctx.textAlign = "center";
          ctx.fillStyle = "#e0f2fe";
          ctx.fillText(zoneHint, 0, -r - 8);
        }

        ctx.restore();
      }

      // =========================================================================
      // Realistic 3D-Projected Shaded Soccer Ball with Spin & Vapor Trail
      // =========================================================================
      function drawBall() {
        const b = state.ball;
        if (!b.visible) return;

        // Ground shadow projected cleanly on pitch
        let shadowY = b.y + b.radius * 0.88;
        let shadowScale = 1;
        let shadowAlpha = 0.48;
        if (state.phase === "FLIGHT" && state.shot) {
          const t = Math.min(1, state.shot.elapsed / state.shot.duration);
          const easeT = 1 - Math.pow(1 - t, 1.55);
          shadowY = state.shot.startY + (layout.horizonY + 5 - state.shot.startY) * easeT + 8;
          const heightRatio = b.z / (layout.goal.h * 1.15);
          shadowScale = Math.max(0.32, 1 - heightRatio * 0.55);
          shadowAlpha = Math.max(0.14, 0.45 - heightRatio * 0.25);
        } else if (state.phase === "AIMING") {
          shadowY = layout.spot.y + b.radius * 0.86;
          shadowScale = 1.05;
        } else {
          shadowY = Math.max(b.y + b.radius * 0.8, layout.horizonY + 2);
          shadowScale = 0.7;
          shadowAlpha = 0.34;
        }

        ctx.save();
        const shGrad = ctx.createRadialGradient(b.x, shadowY, 1, b.x, shadowY, b.radius * 1.15 * shadowScale);
        shGrad.addColorStop(0, `rgba(0, 0, 0, ${shadowAlpha.toFixed(2)})`);
        shGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = shGrad;
        ctx.beginPath();
        ctx.ellipse(b.x, shadowY, b.radius * 1.15 * shadowScale, b.radius * 0.42 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Aerodynamic flight trail
        if (b.trail.length > 2) {
          for (let i = 1; i < b.trail.length; i++) {
            const p0 = b.trail[i - 1];
            const p1 = b.trail[i];
            const frac = i / b.trail.length;
            ctx.strokeStyle = `rgba(120, 250, 232, ${(frac * 0.32).toFixed(3)})`;
            ctx.lineWidth = p1.r * frac * 1.35;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();
          }
        }

        // Sphere base shading (floodlight top-left key light + cool rim + subtle turf bounce)
        ctx.translate(b.x, b.y);
        const R = b.radius;

        const baseGrad = ctx.createRadialGradient(-R * 0.34, -R * 0.38, R * 0.08, 0, 0, R);
        baseGrad.addColorStop(0, "#ffffff");
        baseGrad.addColorStop(0.55, "#edf2f7");
        baseGrad.addColorStop(0.84, "#b8c7d9");
        baseGrad.addColorStop(1, "#6b7f99");

        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.fill();

        // Clip 3D rotating truncated-icosahedron panels inside ball silhouette
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.clip();

        const m = b.rotMat;

        // Draw hexagon seam lines
        ctx.strokeStyle = "rgba(30, 41, 59, 0.38)";
        ctx.lineWidth = Math.max(0.85, R * 0.052);
        ctx.beginPath();
        for (const [a, c] of BALL_MESH.seams) {
          const pa = transformVec3(m, a);
          const pc = transformVec3(m, c);
          if (pa.z < -0.12 && pc.z < -0.12) continue;
          ctx.moveTo(pa.x * R, pa.y * R);
          ctx.lineTo(pc.x * R, pc.y * R);
        }
        ctx.stroke();

        // Draw 12 classic dark pentagons with spherical shading
        for (const pent of BALL_MESH.pentagons) {
          const ctr = transformVec3(m, pent.center);
          if (ctr.z < -0.22) continue;

          ctx.beginPath();
          for (let i = 0; i < pent.verts.length; i++) {
            const pv = transformVec3(m, pent.verts[i]);
            const sx = pv.x * R;
            const sy = pv.y * R;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.closePath();

          // Shade each pentagon based on its orientation toward overhead floodlight
          const lightDot = Math.max(0, Math.min(1, (-ctr.x * 0.35 - ctr.y * 0.45 + ctr.z * 0.82)));
          const shade = Math.round(16 + lightDot * 34);
          ctx.fillStyle = `rgb(${shade}, ${shade + 8}, ${shade + 22})`;
          ctx.fill();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
          ctx.lineWidth = Math.max(0.6, R * 0.03);
          ctx.stroke();
        }

        // Spherical ambient shadow & green pitch bounce light overlay
        const ambientOverlay = ctx.createRadialGradient(-R * 0.35, -R * 0.38, R * 0.2, 0, 0, R * 1.05);
        ambientOverlay.addColorStop(0, "rgba(255, 255, 255, 0.32)");
        ambientOverlay.addColorStop(0.45, "rgba(255, 255, 255, 0)");
        ambientOverlay.addColorStop(0.78, "rgba(10, 22, 42, 0.24)");
        ambientOverlay.addColorStop(1, "rgba(8, 28, 22, 0.48)");
        ctx.fillStyle = ambientOverlay;
        ctx.fillRect(-R, -R, R * 2, R * 2);

        // Crisp glossy floodlight specular highlight
        const spec = ctx.createRadialGradient(-R * 0.36, -R * 0.40, 0, -R * 0.36, -R * 0.40, R * 0.42);
        spec.addColorStop(0, "rgba(255, 255, 255, 0.72)");
        spec.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = spec;
        ctx.beginPath();
        ctx.arc(-R * 0.36, -R * 0.40, R * 0.42, 0, Math.PI * 2);
        ctx.fill();

        // Subtle emerald turf bounce light along lower edge
        const bounce = ctx.createRadialGradient(0, R * 0.88, R * 0.05, 0, R * 0.88, R * 0.65);
        bounce.addColorStop(0, "rgba(74, 222, 128, 0.22)");
        bounce.addColorStop(1, "rgba(74, 222, 128, 0)");
        ctx.fillStyle = bounce;
        ctx.fillRect(-R, 0, R * 2, R);

        ctx.restore();

        // Crisp subtle rim edge
        ctx.strokeStyle = "rgba(15, 23, 42, 0.5)";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      // =========================================================================
      // Effects Layer (Impact Rings, Sparks, Turf Blades, 3D Tumbling Confetti)
      // =========================================================================
      function drawEffects() {
        for (const ring of state.rings) {
          ctx.save();
          ctx.strokeStyle = ring.color;
          ctx.globalAlpha = Math.max(0, ring.alpha);
          ctx.lineWidth = 2.8;
          ctx.shadowColor = ring.color;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (const p of state.particles) {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;

          if (p.shape === "confetti") {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot || 0);
            const flipScale = Math.cos(p.flipPhase || 0);
            ctx.fillRect(-p.size * 0.65, -p.size * 0.35 * flipScale, p.size * 1.3, p.size * 0.7 * flipScale);
          } else if (p.shape === "spark") {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = Math.max(1.5, p.size * 0.55);
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 0.032, p.y - p.vy * 0.032);
            ctx.stroke();
          } else if (p.shape === "blade") {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot || 0);
            ctx.fillRect(-p.size * 0.8, -1.1, p.size * 1.6, 2.2);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // =========================================================================
      // Master Frame Render
      // =========================================================================
      function render(nowMs) {
        const nowSec = nowMs * 0.001;
        ctx.save();

        if (state.screenShake > 0.2) {
          const sx = (Math.random() - 0.5) * state.screenShake * 1.5;
          const sy = (Math.random() - 0.5) * state.screenShake * 1.5;
          ctx.translate(sx, sy);
        }

        // Blit high-detail static stadium + grass pitch cache
        ctx.drawImage(bgCache, 0, 0, layout.w, layout.h);

        // Live animated sky stars, cheering crowd, LED boards & volumetric floodlights
        drawDynamicStadiumAtmosphere(nowSec);

        // Goal net cage (back wall & side mesh)
        drawGoalNet(nowSec);

        // Depth-correct ordering: ball behind keeper & goal frame once inside net
        const ballInNet = state.phase === "RESULT" && state.shot && state.shot.outcome === "goal";
        if (ballInNet) {
          drawBall();
        }

        drawGoalFrame(nowSec);
        drawGoalkeeper();
        drawReticle(nowSec);

        if (!ballInNet) {
          drawBall();
        }

        drawEffects();

        // Subtle brief flash vignette on goal impact
        if (state.goalGlow > 0.55) {
          const flashAlpha = (state.goalGlow - 0.55) * 0.22;
          ctx.fillStyle = state.goalFlashColor;
          ctx.globalAlpha = flashAlpha;
          ctx.fillRect(0, 0, layout.w, layout.h);
        }

        ctx.restore();
      }

      // Animation Loop
      let lastTs = 0;
      function loop(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        update(dt);
        render(ts);
        requestAnimationFrame(loop);
      }

      // =========================================================================
      // Touch, Mouse & Keyboard Controls
      // =========================================================================
      shootBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        takeShot();
      });
      shootBtn.addEventListener("click", () => {
        takeShot();
      });

      canvas.addEventListener("pointerdown", (e) => {
        if (state.phase !== "AIMING") return;
        e.preventDefault();
        takeShot();
      });

      playAgainBtn.addEventListener("click", () => {
        startNewRound();
      });

      soundBtn.addEventListener("click", () => {
        Sound.toggle();
      });

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "Enter") {
          if (state.phase === "AIMING") {
            e.preventDefault();
            takeShot();
          } else if (state.phase === "ROUND_OVER") {
            e.preventDefault();
            startNewRound();
          }
        }
      });

      window.addEventListener("resize", resizeCanvas);
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(resizeCanvas).observe(stageEl);
      }

      // Boot
      resizeCanvas();
      startNewRound();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
